name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PlayerSystem.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlayerSystem-apk
          path: PlayerSystem.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Player System build ${{ github.run_number }}
          files: PlayerSystem.apk
          make_latest: true
          body: |
            Download PlayerSystem.apk below and open it on your phone to install or update.
            Your progress is kept when you install over an older build.
