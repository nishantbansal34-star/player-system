<title>Player System</title>
<style>
/*@FONTS@*/
/* Layout: phone-first single column; ambient lightning canvas behind glass cards; bottom nav; overlays for level-up, loot, menu. Single dark look by choice (the System is always night). */
:root{
  /* palette (Shadow System spec) */
  --bg:#03050B; --bg-2:#070B16; --surface:#0B1121; --surface-2:#101A30; --surface-3:#172344;
  --blue:#4169FF; --blue-2:#2855FF; --blue-hi:#9FB6FF; --blue-line:#5B7BFF; --btn-top:#2A47D8; --btn-bot:#14206E;
  --violet:#8B5CFF; --violet-hi:#B08CFF; --violet-deep:#5A2FD6; --cyan:#42DDF5; --green:#35E6A0;
  --gold:#FFC857; --gold-hi:#FFD98A; --red:#FF4667; --red-hi:#FF9AAE; --red-deep:#A8122E;
  --ink:#F5F7FF; --ink-2:#D6E0FF; --dim:#A5B0CC; --faint:#687693;
  --blue-rgb:65 105 255; --blue-soft-rgb:110 140 255; --violet-rgb:139 92 255; --violet-deep-rgb:22 12 48; --cyan-rgb:66 221 245;
  --red-rgb:255 70 103; --gold-rgb:255 200 87; --bg-rgb:7 11 22;
  /* surfaces */
  --card:var(--surface); --card-2:var(--surface-2); --line:#202E4D; --line-2:rgb(var(--blue-rgb) / .55);
  --glow:var(--blue); --glow-2:var(--blue-hi);
  /* type */
  --f-display:"Cinzel","Trajan Pro",Georgia,serif; --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --fs-hero:32px; --fs-h:24px; --fs-level:46px; --fs-title:16px; --fs-body:15px; --fs-sec:13px; --fs-meta:11.5px;
  /* space & shape: 4-pt scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --r-card:14px; --r-btn:12px; --h-btn:48px; --tap:44px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--glow-2);outline-offset:2px;border-radius:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 16px calc(92px + env(safe-area-inset-bottom,0px));min-height:100%}
.ico{width:22px;height:22px;flex:none;display:block}

/* top bar */
.sysbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;gap:12px}
.wordmark{font-family:var(--f-display);font-weight:600;letter-spacing:.34em;font-size:20px;color:#d7e4ff;text-shadow:0 0 14px rgb(var(--blue-soft-rgb) / .75),0 0 2px rgba(180,210,255,.8)}
.iconbtn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:#bcd1ff}
.iconbtn:active{background:rgb(var(--blue-rgb) / .14)}
.badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.back{display:flex;align-items:center;gap:4px;color:var(--dim);font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.screen-title{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.18em;text-align:center;margin:14px 0 4px;text-transform:uppercase;text-wrap:balance;text-shadow:0 0 16px rgb(var(--blue-soft-rgb) / .45)}
.screen-sub{text-align:center;color:var(--dim);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* surfaces */
.card{position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4);
  box-shadow:inset 0 1px 0 rgba(160,190,255,.06),0 0 22px rgba(40,90,255,.07);}
.card.hot{border-color:var(--line-2);box-shadow:inset 0 0 18px rgb(var(--blue-rgb) / .12),0 0 24px rgb(var(--blue-rgb) / .18)}
.card.red{border-color:rgb(var(--red-rgb) / .45);background:linear-gradient(180deg,rgba(70,10,24,.55),rgba(30,6,14,.7));box-shadow:0 0 24px rgb(var(--red-rgb) / .14)}
.card.violet{border-color:rgb(var(--violet-rgb) / .45);background:linear-gradient(180deg,rgba(48,24,100,.5),rgba(18,10,40,.7))}
.label{font-family:var(--f-ui);font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}

.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13.5px;
  padding:12px 20px;border-radius:999px;border:1.5px solid var(--blue-line);color:#fff;
  background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:0 0 18px rgb(var(--blue-rgb) / .5),inset 0 0 14px rgba(130,175,255,.35),inset 0 1px 0 rgba(200,220,255,.4);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.38;box-shadow:none;cursor:not-allowed}
.btn.wide{width:100%}
.btn.ghost{background:rgb(var(--blue-rgb) / .08);border-color:var(--line-2);box-shadow:none;color:var(--ink-2)}
.btn.red{border-color:var(--red);background:linear-gradient(180deg,#8d1c30,#43091a);box-shadow:0 0 18px rgb(var(--red-rgb) / .4),inset 0 0 12px rgba(255,140,160,.25)}
.btn.gold{border-color:#f5c56a;background:linear-gradient(180deg,#8a5a12,#3d2605);box-shadow:0 0 18px rgb(var(--gold-rgb) / .35),inset 0 0 12px rgba(255,210,130,.25)}
.btn.violet{border-color:var(--violet-hi);background:linear-gradient(180deg,#4b2aa8,#1f0f55);box-shadow:0 0 18px rgb(var(--violet-rgb) / .45),inset 0 0 12px rgba(190,160,255,.3)}
.btn.sm{padding:7px 12px;font-size:11.5px;min-height:38px}

.bar{height:6px;border-radius:99px;background:rgb(var(--blue-soft-rgb) / .16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-2),var(--blue-hi));box-shadow:0 0 10px rgb(var(--blue-soft-rgb) / .9);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thick{height:9px}
.bar.red>i{background:linear-gradient(90deg,var(--red-deep),#ff7b8e);box-shadow:0 0 10px rgb(var(--red-rgb) / .8)}
.bar.violet>i{background:linear-gradient(90deg,var(--violet-deep),#c3a4ff);box-shadow:0 0 10px rgb(var(--violet-rgb) / .8)}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:rgb(var(--blue-rgb) / .08);color:var(--ink-2)}
.pill .ico{width:14px;height:14px}
.pill.gold{color:var(--gold);border-color:rgb(var(--gold-rgb) / .4);background:rgb(var(--gold-rgb) / .08)}
.pill.red{color:var(--red-hi);border-color:rgb(var(--red-rgb) / .45);background:rgb(var(--red-rgb) / .08)}
.pill.violet{color:#cdb6ff;border-color:rgb(var(--violet-rgb) / .45);background:rgb(var(--violet-rgb) / .1)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:rgb(var(--bg-rgb) / .6)}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg button.on{color:#fff;background:linear-gradient(180deg,var(--btn-top),#0f2a7a);box-shadow:0 0 12px rgb(var(--blue-rgb) / .45),inset 0 0 0 1px var(--blue-line)}

/* home */
.home-hero{position:relative;min-height:360px;padding-top:28px;overflow:hidden}
.crystal-art{position:absolute;right:-30px;top:0;width:230px;height:360px;pointer-events:none;opacity:.95}
.greet{color:#c8d6f5;font-size:15px}
.who{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1.1;text-transform:uppercase;text-shadow:0 0 18px rgb(var(--blue-soft-rgb) / .5)}
.lvl-lbl{font-family:var(--f-ui);letter-spacing:.2em;font-size:13px;color:#a9bde6;margin-top:26px}
.lvl-big{display:flex;align-items:flex-end;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:78px;line-height:.9;color:#fff;text-shadow:0 0 22px rgb(var(--blue-soft-rgb) / .85)}
.lvl-big .ico{width:30px;height:30px;color:var(--glow-2);filter:drop-shadow(0 0 6px var(--glow));margin-bottom:8px}
.xp-row{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:13px;color:#b9c8ea;margin-top:6px}
.quote{margin:22px 0 0;max-width:230px;color:#b8c6e8;font-size:15px;font-style:italic;line-height:1.45}
.quote::before{content:"\201C";color:var(--glow-2);font-size:22px;margin-right:4px;vertical-align:-3px}
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.mini-ring{width:70px;height:70px}
.today h3{margin:0;font-family:var(--f-ui);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}

/* quests */
.quest{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px}
.qicon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgb(var(--blue-rgb) / .28),rgb(var(--blue-rgb) / .04));border:1px solid rgb(var(--blue-soft-rgb) / .2)}
.qicon .ico{width:24px;height:24px;filter:drop-shadow(0 0 5px currentColor)}
.qname{font-weight:600;font-size:15.5px}
.qdetail{font-size:12.5px;color:var(--dim)}
.qxp{font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:var(--blue-hi)}
.qcheck{width:32px;height:32px;border-radius:50%;border:1.6px solid rgba(200,215,255,.55);display:grid;place-items:center;transition:all .2s}
.qcheck .ico{width:16px;height:16px;opacity:0}
.quest.done .qcheck{border-color:var(--blue-hi);background:radial-gradient(circle,var(--blue-line),#1d4fd6);box-shadow:0 0 14px rgb(var(--blue-soft-rgb) / .9)}
.quest.done .qcheck .ico{opacity:1;color:#fff}
.quest.done{border-color:var(--line-2);box-shadow:inset 0 0 22px rgb(var(--blue-rgb) / .14),0 0 18px rgb(var(--blue-rgb) / .14)}
.quest.done .qname{color:var(--ink-2)}
.drill{grid-column:1/-1;margin:2px 0 0;padding:10px 12px;border-radius:10px;background:rgb(var(--bg-rgb) / .55);border:1px dashed rgb(var(--blue-soft-rgb) / .22);font-size:13px;color:#c2cfee}
.drill ul{margin:4px 0 0;padding-left:18px}
.drill li{margin:2px 0}
.progress-line{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;color:var(--dim);margin:2px 2px 0}

/* status */
.ring-wrap{position:relative;width:220px;height:220px;margin:4px auto 6px}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .l{font-family:var(--f-ui);letter-spacing:.22em;font-size:14px;color:#b5c6ea}
.ring-center .n{font-family:var(--f-ui);font-weight:700;font-size:64px;line-height:1;color:#fff;text-shadow:0 0 20px rgb(var(--blue-soft-rgb) / .9)}
.ring-center .x{font-family:var(--f-ui);font-size:12px;color:#a9b8dc;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat-tile{padding:12px 10px 10px;text-align:center}
.stat-tile .k{font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;font-size:13px;color:#b9c9ee}
.stat-tile .v{font-family:var(--f-ui);font-weight:700;font-size:26px;margin:2px 0 6px;text-shadow:0 0 12px rgb(var(--blue-soft-rgb) / .6)}
.stat-tile .plus-b{font-size:11px;color:var(--green);font-family:var(--f-ui)}
.classcard{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center}
.classrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px 0}
.classrow .ico{width:26px;height:26px;color:var(--glow-2);filter:drop-shadow(0 0 6px var(--glow))}
.classrow .t{font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.classrow .v{font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase}

/* allocate */
.alloc-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid rgb(var(--blue-soft-rgb) / .1)}
.alloc-row:last-child{border-bottom:0}
.alloc-row .nm{font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;font-size:13.5px;text-transform:uppercase}
.alloc-row .cur{font-size:12px;color:var(--dim)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:rgb(var(--bg-rgb) / .6)}
.stepper button{width:38px;height:36px;font-size:20px;color:var(--ink-2);display:grid;place-items:center}
.stepper button:disabled{opacity:.3}
.stepper span{width:40px;text-align:center;font-family:var(--f-ui);font-weight:600;font-size:16px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:36px}

/* achievements */
.ach{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px}
.medal{width:62px;height:62px;border-radius:12px;display:grid;place-items:center}
.medal .ico{width:34px;height:34px}
.ach .nm{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.ach .ds{font-size:12.5px;color:#c0cbe6}
.rar{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.ach.legendary{border-color:rgb(var(--gold-rgb) / .55);background:linear-gradient(110deg,rgba(120,72,10,.55),rgba(40,22,4,.7) 60%,rgba(90,55,8,.5));box-shadow:0 0 22px rgb(var(--gold-rgb) / .18)}
.ach.legendary .medal{color:var(--gold-hi);background:radial-gradient(circle,rgb(var(--gold-rgb) / .35),transparent 70%)}
.ach.legendary .medal .ico{filter:drop-shadow(0 0 8px var(--gold))} .ach.legendary .rar{color:var(--gold)}
.ach.epic{border-color:rgb(var(--violet-rgb) / .5);background:linear-gradient(110deg,rgba(60,26,120,.55),rgb(var(--violet-deep-rgb) / .7))}
.ach.epic .medal{color:var(--violet-hi);background:radial-gradient(circle,rgb(var(--violet-rgb) / .35),transparent 70%)}
.ach.epic .medal .ico{filter:drop-shadow(0 0 8px var(--violet))} .ach.epic .rar{color:var(--violet-hi)}
.ach.rare{border-color:rgb(var(--blue-rgb) / .5)}
.ach.rare .medal{color:#a9ccff;background:radial-gradient(circle,rgb(var(--blue-rgb) / .35),transparent 70%)}
.ach.rare .medal .ico{filter:drop-shadow(0 0 8px var(--blue))} .ach.rare .rar{color:#8fbaff}
.ach.mythic{border-color:rgb(var(--red-rgb) / .5);background:linear-gradient(110deg,rgba(70,10,40,.6),rgba(24,6,30,.75))}
.ach.mythic .medal{color:#ffb0c0;background:radial-gradient(circle,rgb(var(--red-rgb) / .3),transparent 70%)} .ach.mythic .rar{color:var(--red-hi)}
.ach.common .medal{color:#c7d2ea;background:radial-gradient(circle,rgba(160,175,210,.25),transparent 70%)} .ach.common .rar{color:var(--dim)}
.ach.locked{filter:saturate(.25) brightness(.7)}
.ach.locked .medal .ico{filter:none}

/* inventory */
.inv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 10px;text-align:center;border-radius:12px}
.tile .art{width:100%;max-width:92px;aspect-ratio:1}
.tile .art svg{width:100%;height:100%}
.tile .nm{font-size:12.5px;line-height:1.2;font-weight:600;color:#dbe5ff}
.tile .ct{font-family:var(--f-ui);font-size:11px;color:var(--dim)}
.tile.locked{opacity:.35}
.empty{padding:22px;text-align:center;color:var(--dim)}

/* stats */
.srow{display:grid;grid-template-columns:24px 92px 1fr 44px;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid rgb(var(--blue-soft-rgb) / .08)}
.srow:last-child{border-bottom:0}
.srow .nm{font-size:13.5px}
.srow .pc{font-family:var(--f-ui);font-weight:600;text-align:right;font-size:14px}
.minibars{display:flex;align-items:flex-end;gap:2px;height:26px;min-width:0}
.minibars i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:var(--c);box-shadow:0 0 6px var(--c);opacity:.95}
.minibars i.off{background:rgba(120,140,200,.16);box-shadow:none;height:4px!important}
.xpbig{font-family:var(--f-ui);font-weight:700;font-size:34px;color:#fff;text-shadow:0 0 14px rgb(var(--blue-soft-rgb) / .7)}
.xpbig small{font-size:14px;color:var(--blue-hi);margin-left:4px}
.xpbars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:10px}
.xpbars i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--blue-hi),#1f4fd6);box-shadow:0 0 8px rgb(var(--blue-soft-rgb) / .6);min-height:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{text-align:center;padding:12px 6px}
.kpi .n{font-family:var(--f-ui);font-weight:700;font-size:24px}
.kpi .t{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* v4 visual layer */
.rbadge{display:block;overflow:visible}
.hero-badge{position:absolute;right:-6px;top:34px;width:150px;height:150px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgb(var(--blue-soft-rgb) / .55))}
.hero-badge.gold{filter:drop-shadow(0 0 24px rgb(var(--gold-rgb) / .55))}
.orbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.orb{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.orb .ball{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgb(var(--blue-soft-rgb) / .55);background:radial-gradient(circle at 50% 30%,rgb(var(--blue-rgb) / .3),rgb(var(--bg-rgb) / .9) 70%);box-shadow:0 0 14px rgb(var(--blue-rgb) / .35),inset 0 0 12px rgb(var(--blue-soft-rgb) / .2);transition:transform .15s,box-shadow .25s}
.orb .ball .ico{width:26px;height:26px;filter:drop-shadow(0 0 6px currentColor)}
.orb:active .ball{transform:scale(.93)}
.orb.done .ball{border-color:#9cc8ff;background:radial-gradient(circle at 50% 30%,var(--blue-line),#12339c 75%);box-shadow:0 0 22px rgb(var(--blue-soft-rgb) / .9),inset 0 0 14px rgba(200,225,255,.5)}
.orb.done .ball .ico{color:#fff!important}
.orb .tick{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 10px var(--green)}
.orb .tick .ico{width:12px;height:12px;color:#03140c!important;filter:none}
.orb .on{font-size:12px;color:#d7e3ff;line-height:1.15;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orb .ox{font-family:var(--f-ui);font-size:11.5px;color:var(--blue-hi);font-weight:600}
.quote-card{font-style:italic;color:#c3d0f0;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.quote-card .qm{font-family:var(--f-display);font-size:34px;line-height:.8;color:#6fa8ff;text-shadow:0 0 12px var(--blue)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec-h h2{margin:0;font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;font-size:15px}
.avbtn{width:40px;height:40px;border-radius:50%;display:block}
.avbtn svg{width:40px;height:40px}
.week{width:100%;border-collapse:separate;border-spacing:0 6px}
.week th{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:600;padding:0 0 4px}
.week th.today{color:#fff;text-shadow:0 0 8px var(--blue)}
.week td{text-align:center;padding:0}

#splash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7vh 24px calc(10vh + env(safe-area-inset-bottom,0px));transition:opacity .6s ease;pointer-events:none}

@keyframes splzoom{from{transform:scale(1.08);opacity:0}to{transform:scale(1);opacity:1}}
.artslot.onb-art{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.9;-webkit-mask:linear-gradient(180deg,transparent 0,#000 12%,#000 55%,transparent 92%);mask:linear-gradient(180deg,transparent 0,#000 12%,#000 55%,transparent 92%)}
.onb-art img{width:100%;height:100%;object-fit:cover;object-position:center 40%}

.app,.nav{transition:opacity .5s ease}
#splash .sw{font-family:var(--f-display);font-weight:600;letter-spacing:.34em;font-size:40px;color:#e6efff;text-shadow:0 0 24px rgb(var(--blue-soft-rgb) / .95),0 0 3px #fff;padding-left:.34em}

#splash .sa{font-family:var(--f-display);letter-spacing:.6em;font-size:16px;color:var(--ink-2);text-shadow:0 0 14px var(--blue);padding-left:.6em}

.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:space-between;padding:6vh 0 4vh}

.onb .card{padding:22px 18px}
.shock{position:absolute;left:50%;top:40%;width:10px;height:10px;border-radius:50%;border:2px solid rgba(160,200,255,.8);transform:translate(-50%,-50%);animation:shock 1.6s ease-out infinite;pointer-events:none}

.toast{grid-template-columns:48px 1fr auto;padding:12px;border-radius:14px;background:linear-gradient(110deg,rgba(18,34,86,.97),rgb(var(--bg-rgb) / .97))}
.toast .ti{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,rgb(var(--blue-rgb) / .35),transparent 70%);border:1px solid rgb(var(--blue-soft-rgb) / .35)}
.toast .ti .ico{width:26px;height:26px;filter:drop-shadow(0 0 6px currentColor)}
.toast .tm{font-family:var(--f-ui);font-weight:600;font-size:15px;color:#fff;display:block;margin-top:1px}

.toast.red{background:linear-gradient(110deg,rgba(100,14,34,.97),rgba(30,6,14,.97))}
.toast.streak{border-color:rgba(255,140,60,.7);box-shadow:0 0 24px rgba(255,120,40,.35);background:linear-gradient(110deg,rgba(110,40,6,.97),rgba(34,12,4,.97))}

.stat-tile .k{font-size:10.5px;letter-spacing:.12em}
.code-big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.3em;text-align:center;color:#fff;text-shadow:0 0 18px rgb(var(--blue-soft-rgb) / .9);padding-left:.3em}
.lb-row{display:grid;grid-template-columns:28px 36px 1fr auto;gap:10px;align-items:center;padding:11px 6px;border-bottom:1px solid rgb(var(--blue-soft-rgb) / .1);width:100%;text-align:left}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:linear-gradient(90deg,rgb(var(--blue-rgb) / .18),transparent);border-radius:10px}
.lb-pos{font-family:var(--f-ui);font-weight:700;font-size:16px;text-align:center;color:var(--dim)}
.lb-pos.p1{color:var(--gold-hi);text-shadow:0 0 10px rgb(var(--gold-rgb) / .8)} .lb-pos.p2{color:#dfe6f5} .lb-pos.p3{color:#e0a15e}
.lb-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#eaf3ff;background:radial-gradient(circle at 50% 35%,#23408f,#050a1c);border:1.5px solid rgb(var(--blue-soft-rgb) / .6);box-shadow:0 0 10px rgb(var(--blue-rgb) / .4)}
.lb-val{font-family:var(--f-ui);font-weight:700;font-size:17px;text-align:right}
.lb-sub{font-size:11.5px;color:var(--dim)}
.chip-ok{color:var(--green)} .chip-mid{color:var(--blue-hi)} .chip-off{color:var(--faint)}
.urgent-card{border-color:rgb(var(--red-rgb) / .6);background:linear-gradient(120deg,rgba(110,14,34,.75),rgba(30,8,40,.8));box-shadow:0 0 26px rgb(var(--red-rgb) / .3);animation:upulse 2s ease-in-out infinite}

.urgent-card .label{color:var(--red-hi)}
.mpbar>i{background:linear-gradient(90deg,var(--violet-deep),#b48cff);box-shadow:0 0 10px rgb(var(--violet-rgb) / .9)}
.skill{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:14px}
.skill .si{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:1px solid rgb(var(--violet-rgb) / .5);background:radial-gradient(circle,rgb(var(--violet-rgb) / .35),rgba(10,6,30,.9) 75%);color:var(--violet-hi)}
.skill .si .ico{width:28px;height:28px;filter:drop-shadow(0 0 7px var(--violet))}
.skill.locked{opacity:.55}.skill.locked .si{filter:grayscale(.7)}
.skill .nm{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dg{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px}
.run-ring{position:relative;width:260px;height:260px;margin:10px auto}
.run-ring .ring-center .n{font-size:54px}
.tower{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid rgb(var(--violet-rgb) / .2);background:rgb(var(--violet-deep-rgb) / .5)}
.floor.cur{border-color:var(--violet-hi);box-shadow:0 0 18px rgb(var(--violet-rgb) / .5);background:linear-gradient(90deg,rgba(90,50,200,.45),rgb(var(--violet-deep-rgb) / .6))}
.floor.done{opacity:.5}
.floor.boss{border-color:rgb(var(--red-rgb) / .55);background:linear-gradient(90deg,rgba(90,10,30,.55),rgba(20,8,30,.6))}
.floor .fn{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;color:var(--violet-hi)}
.boss-card{position:relative;overflow:hidden}
.boss-card .bhp{height:12px;border-radius:6px;background:rgb(var(--red-rgb) / .15);overflow:hidden;border:1px solid rgba(255,120,140,.35)}
.boss-card .bhp i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));box-shadow:0 0 12px rgb(var(--red-rgb) / .8);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.boss-card.rage{border-color:rgb(var(--red-rgb) / .65);box-shadow:0 0 28px rgb(var(--red-rgb) / .3)}
.boss-card.down{border-color:rgb(var(--gold-rgb) / .55)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-family:var(--f-ui);font-weight:700;font-size:12px;letter-spacing:.06em}
.mchip.haste{color:#7afcff;background:rgb(var(--cyan-rgb) / .12);border:1px solid rgba(122,252,255,.45);box-shadow:0 0 12px rgb(var(--cyan-rgb) / .25)}
.mchip.combo{color:var(--gold-hi);background:rgb(var(--gold-rgb) / .12);border:1px solid rgb(var(--gold-rgb) / .5);box-shadow:0 0 12px rgb(var(--gold-rgb) / .3)}
.mchip.risk{color:var(--red-hi);background:rgb(var(--red-rgb) / .12);border:1px solid rgb(var(--red-rgb) / .5)}
.nextup{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,140,160,.2)}
.minbtn{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:var(--blue-hi);text-transform:uppercase;text-align:left;grid-column:2/-1;margin-top:-4px}
.slot{font-family:var(--f-ui);font-size:11px;color:var(--blue-hi);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
/* v8: art slots, sessions, trackers, boss battle */
.artslot{position:relative;overflow:hidden}
.artslot>svg,.artslot>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.artslot.full{position:absolute;inset:0}
.session-bg{position:fixed;inset:0;z-index:0;opacity:.35;pointer-events:none;-webkit-mask:linear-gradient(180deg,#000 0%,transparent 75%);mask:linear-gradient(180deg,#000 0%,transparent 75%)}
.session-bg ~ *{position:relative;z-index:1}
.session-bg.scr{opacity:.55;-webkit-mask:linear-gradient(180deg,#000 0%,#000 35%,transparent 88%);mask:linear-gradient(180deg,#000 0%,#000 35%,transparent 88%)}
.session-bg.scr.deep{opacity:.6;top:120px}
.artslot.ico{width:100%;height:100%}.artslot.ico>img{object-fit:contain}
.av-img{position:relative;display:inline-block;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgb(var(--violet-rgb) / .7),0 0 18px rgb(var(--violet-rgb) / .45)}
.av-img>svg,.av-img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.rk-img{position:relative;display:inline-grid;place-items:center;flex:none}
.rk-img>svg{width:100%;height:100%}.rk-img>img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:contain;opacity:0}
.rk-img>b{position:absolute;inset:0;display:none;place-items:center;padding-bottom:6%;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-shadow:0 0 8px rgba(0,0,0,.9),0 0 14px currentColor}
.rk-img.ok>svg{display:none}.rk-img.ok>img{opacity:1}.rk-img.ok>b{display:grid}
.boss-card{padding:0;overflow:hidden}.boss-band{height:170px}.boss-band>img{object-position:center 22%}
.boss-cap{padding:12px 16px 14px}
.soldier{position:relative;overflow:hidden}.sh-img{position:absolute!important;right:-14px;bottom:-10px;width:84px!important;height:84px!important;opacity:.85;pointer-events:none}
.soldier.dormant .sh-img{filter:grayscale(1);opacity:.35}
.sh-lock{float:right;width:90px!important;height:90px!important;margin:-6px -6px 0 8px;filter:grayscale(.7) brightness(.7)}
.drill-list{list-style:none;margin:8px 0 0;padding:0}
.drill-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-body)}
.drill-list li:last-child{border-bottom:0}
.glasses{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.glasses span{width:22px;height:30px;border-radius:3px 3px 7px 7px;border:1.5px solid rgb(var(--cyan-rgb) / .5)}
.glasses span.on{background:linear-gradient(180deg,rgb(var(--cyan-rgb) / .35),rgb(var(--cyan-rgb) / .85));box-shadow:0 0 8px rgb(var(--cyan-rgb) / .6)}
.quest{position:relative}
.qhit{position:absolute;inset:0;border-radius:var(--r-card);z-index:0}
.qhit:active{background:rgb(var(--blue-rgb) / .06)}
.quest>*:not(.qhit){position:relative;z-index:1;pointer-events:none}
.quest>.qcheck,.quest>button:not(.qhit){pointer-events:auto}
.qstat{display:flex;align-items:center;gap:4px;font-family:var(--f-ui);font-weight:600;font-size:10.5px;letter-spacing:.12em;margin-top:3px}
.quest.min .qcheck{background:radial-gradient(circle,var(--blue-hi),var(--blue) 80%)!important}
.qcheck{position:relative}
.qcheck::after{content:"";position:absolute;inset:-9px}
.boss-hero{position:relative;height:300px;margin:-12px -16px 0;overflow:hidden}
.boss-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,11,.25) 0%,rgba(3,5,11,0) 40%,var(--bg) 100%)}
.boss-title{position:absolute;left:16px;right:16px;bottom:14px}
.boss-title .bname{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.06em;text-shadow:0 2px 18px rgba(0,0,0,.8),0 0 24px rgb(var(--red-rgb) / .5)}
.bhp{height:12px;border-radius:6px;background:rgb(var(--red-rgb) / .15);overflow:hidden;border:1px solid rgb(var(--red-rgb) / .35)}
.bhp i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));box-shadow:0 0 12px rgb(var(--red-rgb) / .8);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bhp.big{height:16px;border-radius:8px}
.victory{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:rgb(var(--gold-rgb) / .1);border:1px solid rgb(var(--gold-rgb) / .45);color:var(--gold-hi)}
.victory .ico{width:30px;height:30px}
.boss-win{border-color:rgb(var(--gold-rgb) / .5)}
.boss-thumb{width:96px;height:96px;border-radius:12px;flex:none;border:1px solid rgb(var(--red-rgb) / .45);box-shadow:0 0 18px rgb(var(--red-rgb) / .25)}
.idcard{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.markers{display:flex;gap:6px;margin:10px 0 8px}
.markers span{flex:1;height:8px;border-radius:4px;background:rgb(var(--blue-soft-rgb) / .15)}
.markers span.on{background:linear-gradient(90deg,var(--blue),var(--blue-hi));box-shadow:0 0 8px rgb(var(--blue-rgb) / .7)}

.markers span.goal{outline:1px dashed rgb(var(--gold-rgb) / .7);outline-offset:2px}
.rec-card .qname{font-family:var(--f-ui);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.inv-filter{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.inv-filter select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.tile{position:relative}
.tile.r-legendary{border-color:rgb(var(--gold-rgb) / .55)} .tile.r-epic{border-color:rgb(var(--violet-rgb) / .55)} .tile.r-rare{border-color:rgb(var(--blue-rgb) / .55)}
.tile .rr{font-family:var(--f-ui);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.tile .qty{position:absolute;top:6px;right:8px;font-family:var(--f-ui);font-weight:700;font-size:12px;color:var(--ink-2)}
@media (max-width:360px){.boss-title .bname{font-size:24px}.boss-hero{height:240px}.idcard{grid-template-columns:48px 1fr auto}}
.home-art{position:absolute;left:0;right:0;top:0;height:460px;z-index:-1;opacity:.75;pointer-events:none;-webkit-mask:linear-gradient(180deg,#000 30%,transparent 100%);mask:linear-gradient(180deg,#000 30%,transparent 100%)}
.arcgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;margin-top:10px}
.ac{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-family:var(--f-ui);font-size:9px;color:var(--faint);background:rgb(var(--blue-soft-rgb) / .08)}
.ac.ok{background:var(--blue);color:#fff} .ac.pf{background:var(--blue-hi);color:#08102a} .ac.ps{background:rgb(var(--violet-rgb) / .5);color:#fff} .ac.miss{background:rgb(var(--red-rgb) / .35);color:#fff}
.ac.now{outline:1.5px solid var(--violet-hi);color:var(--ink)} .ac.ms{box-shadow:inset 0 0 0 1.5px var(--gold)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{padding:8px 10px;border-radius:99px;border:1px solid var(--line);font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;color:var(--dim);min-height:38px}
.mood.on{border-color:var(--c);color:var(--c);background:rgb(var(--blue-rgb) / .08)}
.breath-wrap{position:relative;height:62vh;display:grid;place-items:center}
.breath-orb{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgb(var(--violet-rgb) / .55),rgb(var(--blue-rgb) / .25) 60%,transparent 72%);box-shadow:0 0 60px rgb(var(--violet-rgb) / .45),inset 0 0 40px rgb(var(--blue-rgb) / .35);border:1.5px solid rgb(var(--violet-rgb) / .6);transition:transform 1s linear}
.breath-txt{position:absolute;text-align:center}
@media (prefers-reduced-motion:reduce){.breath-orb{transition:none}}
/* heatmap + charts */
.heat{display:flex;gap:3px;width:max-content}
.heat span{display:flex;flex-direction:column;gap:3px}
.heat i{width:9px;height:9px;border-radius:2px;display:block}
.chart svg{width:100%;height:120px;display:block}
.qedit{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgb(var(--blue-soft-rgb) / .1)}
.qedit:last-child{border-bottom:0}
.toggle{width:44px;height:26px;border-radius:99px;background:rgba(120,140,200,.25);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd8ee;transition:transform .2s}
.toggle.on{background:#2f6bff;box-shadow:0 0 10px rgb(var(--blue-rgb) / .6)}
.toggle.on::after{transform:translateX(18px);background:#fff}
/* notifications */
.note{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:14px}
.note .ni{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--blue-hi);border:1px solid var(--line)}
.note .nt{font-family:var(--f-ui);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px}
.note .nb{font-size:13.5px;color:#c7d2ee}

.note.gold .ni{color:var(--gold);border-color:rgb(var(--gold-rgb) / .4)} .note.gold .nt{color:var(--gold)}
.note.red .ni{color:var(--red);border-color:rgb(var(--red-rgb) / .4)}
.note.violet .ni{color:var(--violet-hi);border-color:rgb(var(--violet-rgb) / .4)}

function castleStep(kind){

function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function urgentFor(k){
  if(S.urgent[k]!==undefined) return S.urgent[k];
  if(k<=S.startDate){ S.urgent[k]=null; return null; }
  const rng=seeded("urg"+k+S.startDate); if(rng()>=.43){ S.urgent[k]=null; return null; }
  const d=parseDay(k); const mins=600+Math.floor(rng()*630); d.setHours(0,0,0,0); const at=d.getTime()+mins*60000;
  const t=tierOf(S.level), pick=Math.floor(rng()*8);

  const icons=["dumbbell","dumbbell","dumbbell","shoe","book","drop","star","moon"];

}
function urgentNow(){ if(!S||S.pause) return null; const u=urgentFor(today()); if(!u||u.done||u.missed) return null; const n=Date.now(); return n>=u.at&&n<u.at+u.dur?u:null; }
function urgentSweep(){
  let ch=false; Object.keys(S.urgent).forEach(k=>{ const u=S.urgent[k]; if(u&&!u.done&&!u.missed&&Date.now()>=u.at+u.dur){ u.missed=true; ch=true; if(!S.pause&&!(S.history[k]&&S.history[k].paused)){ S.gold=Math.max(0,S.gold-20); note("urgent","Urgent quest failed","\""+u.text+"\" expired. The System fined you 20 G.","red"); } } });

function openLoot(bonus){
  const h=rec(today());
  if(bonus){ if(!(S.bonusLoot>0)) return; S.bonusLoot--; }
  else { if(!h.loot||h.lootOpened) return; h.lootOpened=true; }
  const r=bonus?Math.random()*.5:Math.random(); let res, artKey="chest";
  const missing=Object.keys(ITEMS).filter(k=>!S.items.includes(k));
  if(r<.10&&missing.length){ const k=missing[Math.floor(Math.random()*missing.length)]; S.items.push(k); artKey=k; res={t:ITEMS[k].name,d:Object.entries(ITEMS[k].bonus).map(([s,v])=>"+"+v+" "+s).join(" · ")+" permanently"}; note("loot","Rare item found",ITEMS[k].name,"gold"); }
  else if(r<.18){ S.potions++; artKey="potion"; res={t:"Status Recovery potion",d:"Cancels one penalty."}; }
  else if(r<.33){ S.keys=(S.keys||0)+1; artKey="key"; res={t:"Dungeon key",d:"Opens an instant dungeon in Gates."}; }
  else if(r<.45){ const x=gain(30+Math.floor(Math.random()*51)); res={t:"+"+x+" bonus XP",d:"Experience added."}; }
  else { const g=50+Math.floor(Math.random()*101); S.gold+=g; artKey="chest"; res={t:"+"+g+" Gold",d:"Spend it in the Store."}; }
  log("Loot box: "+res.t);
  fx.mode="burst"; haptic(80); document.getElementById("toasts").innerHTML="";
  document.getElementById("ov").innerHTML=`<div class="overlay" data-act="ov-bg" style="background:rgba(2,4,12,.35)"><span class="shock"></span><span class="shock s2"></span><div class="lu" style="position:relative">
    <div class="t1">SYSTEM</div><div class="t2" style="font-size:24px">LOOT BOX OPENED</div>
    <div class="loot-chest">${art(artKey)}</div>
    <div class="label" style="color:var(--blue-hi)">You obtained</div>
    <div style="font-family:var(--f-ui);font-weight:700;font-size:26px;margin-top:4px;text-shadow:0 0 14px rgb(var(--blue-soft-rgb) / .8)">${esc(res.t)}</div>
    <div class="small muted">${esc(res.d)}</div>
    <button class="btn" style="margin-top:20px" data-act="lu-close">Continue</button></div></div>`;
  commit();
}

    case "trial": if(S.level<25||S.job!=="None") break; S.jobTrial=today(); note("shadow","Job change quest","Clear every quest at 1.5× targets before the day resets.","violet"); toast("Job change quest","Clear every quest at 1.5× targets today.","violet","ghost"); commit(); go("quests"); break;
    case "arise": { if(S.job==="None"||S.shadows.some(s=>s.habit===id)) break; const name=SHADOW_NAMES[S.shadows.length]; if(!name) break; S.shadows.push({name,habit:id,since:today()}); note("shadow","Arise",name+" joined your shadow army.","violet"); fx.mode="burst"; setTimeout(setScene,1600); toast("Arise",name+" has joined your shadow army.","violet","ghost"); haptic(150); commit(); break; }
    case "buy": {
      if(id==="key"){ if(S.gold<150) break; S.gold-=150; S.keys=(S.keys||0)+1; toast("Store","Dungeon key added.","gold","chest"); commit(); break; }
      if(id==="potion"){ if(S.gold<500) break; S.gold-=500; S.potions++; toast("Store","Status Recovery potion added.","gold","potion"); commit(); break; }
      const r=S.rewards.find(r=>r.id===id); if(!r||S.gold<r.cost) break;
      if(ui.pendingBuy!==id){ ui.pendingBuy=id; render(); break; }
      S.gold-=r.cost; ui.pendingBuy=null; log("Redeemed: "+r.name); note("loot","Reward redeemed",r.name+" (−"+r.cost+" G). Enjoy it.","gold"); toast("Store","Redeemed: "+r.name+". Enjoy it.","gold","coin"); commit(); break; }
    case "del-reward": S.rewards=S.rewards.filter(r=>r.id!==id); commit(); break;
    case "diff": S.settings.difficulty=b.dataset.t; commit(); break;
    case "export": { const code=btoa(unescape(encodeURIComponent(serial()))); const done=()=>toast("Backup","Backup code copied.","","check");
      try{ navigator.clipboard.writeText(code).then(done,()=>{ ui.importOpen=true; render(); const t=document.getElementById("importBox"); t.value=code; t.select(); toast("Backup","Select and copy the code in the box.","","check"); }); }catch(err){} break; }
    case "import-open": ui.importOpen=!ui.importOpen; render(); break;
    case "import": { try{ const d=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("importBox").value.trim())))); if(!d||!d.level) throw 0; S=migrate(d); ui.importOpen=false; processDays(); toast("Backup","Progress restored.","","check"); commit(); }catch(err){ toast("Backup","That code didn't work. Copy the whole code and try again.","red","x"); } break; }
    case "reset": if(!ui.pendingReset){ ui.pendingReset=true; render(); } else { ui.pendingReset=false; S=null; screen="home"; hist=[]; if(window.Android){ try{Android.save("null");}catch(err){} } try{localStorage.removeItem(LS_KEY);}catch(err){} if(docRef) docRef.delete().catch(()=>{}); render(); } break;
  }
});

document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button][data-act]")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("submit",e=>{ e.preventDefault();
  if(e.target.id==="bodyForm"){ const g=id=>{ const v=document.getElementById(id).value.trim(); return v===""?null:Number(v); };
    const en={d:today(),weight:g("bWeight"),waist:g("bWaist"),push:g("bPush"),pull:g("bPull")};

    S.body=S.body||[]; const prevLast=S.body[S.body.length-1]; const earn=!prevLast||(parseDay(en.d)-parseDay(prevLast.d))/864e5>=6;
    if(prevLast&&prevLast.d===en.d) S.body[S.body.length-1]=Object.assign(prevLast,Object.fromEntries(Object.entries(en).filter(([k,v])=>v!=null))); else S.body.push(en);
    if(S.body.length>260) S.body.shift();
    if(earn&&!(prevLast&&prevLast.d===en.d)){ const x=gain(40); toast("Check-in logged","+"+x+" XP. See you next week.","","stats"); } else toast("Check-in","Updated.","","check");
    commit(); return; }
  if(e.target.id==="addFriend"){ const code=document.getElementById("friendCode").value.trim().toUpperCase(); if(code.length!==6){ ui.netErr="Hunter codes have 6 letters and numbers."; render(); return; }
    (async()=>{ try{ const r=await rpc("ps_add_friend",{p_id:S.net.id,p_secret:S.net.secret,p_code:code}); ui.netErr=null; toast("Friend added",(r&&r.name||"Hunter")+" joined your party","","users"); await netBoard(); }catch(err){ ui.netErr=netErr(err); render(); } })(); return; }
  if(e.target.id==="addReward"){ const n=document.getElementById("rewName").value.trim(), c=Math.max(10,Math.round(Number(document.getElementById("rewCost").value)||0)); if(!n) return; S.rewards.push({id:"r"+uid(),name:n,cost:c}); commit(); } });

// ================= ambient scenes =================
// Modes: storm (home), gate (splash/onboarding), vortex (status), moon (profile), burst (level up/loot), calm (everything else).
const fx={mode:"gate",hue:"blue"};
(function(){
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dpr=1,last=0,flash=0,burstT=0,prevMode="";
  const P=[], bolts=[], rings=[], clouds=[], ruins=[], stars=[];
  function size(){
    dpr=Math.min(1.75,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ruins.length=0; let x=-10; while(x<W+20){ const w=14+Math.random()*34, h=H*(.06+Math.random()*.2), broken=Math.random()<.5; ruins.push({x,w,h,broken,arch:Math.random()<.25}); x+=w+4+Math.random()*26; }
    stars.length=0; for(let i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.1+.2,a:Math.random()*6});
  }
  size(); addEventListener("resize",size);
  for(let i=0;i<90;i++) P.push({x:Math.random(),y:Math.random(),v:.00012+Math.random()*.00045,r:.4+Math.random()*1.7,a:Math.random()*6,ang:Math.random()*6.28,rad:.15+Math.random()*.4});
  for(let i=0;i<7;i++) clouds.push({x:Math.random(),y:Math.random()*.55,r:.25+Math.random()*.35,vx:(Math.random()-.5)*.00002,v:Math.random()<.35});
  const col=()=>fx.hue==="violet"?[139,92,255]:[65,105,255];
  function bolt(x0,y0,ang,len,w,depth){
    const pts=[[x0,y0]]; let x=x0,y=y0; const n=8+Math.floor(Math.random()*8); const branches=[];
    for(let i=0;i<n;i++){ const a=ang+(Math.random()-.5)*1.1; x+=Math.cos(a)*len/n; y+=Math.sin(a)*len/n; pts.push([x,y]);
      if(depth<2&&Math.random()<.18) branches.push(bolt(x,y,ang+(Math.random()-.5)*1.4,len*(.3+Math.random()*.3),w*.55,depth+1)); }
    return {pts,branches,life:1,w};
  }
  function drawBolt(b,alpha){
    const c=col();
    ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha*.35})`; ctx.lineWidth=b.w*5; ctx.shadowColor=`rgb(${c[0]},${c[1]},${c[2]})`; ctx.shadowBlur=24;
    ctx.beginPath(); b.pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    ctx.strokeStyle=`rgba(225,238,255,${alpha})`; ctx.lineWidth=b.w; ctx.shadowBlur=10; ctx.stroke();
    b.branches.forEach(x=>drawBolt(x,alpha*.8));
  }
  function glowCircle(x,y,r,rgba){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  function figure(x,y,s){ // generic cloaked wanderer seen from behind
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.fillStyle="#02030a"; ctx.shadowColor="rgba(140,185,255,.95)"; ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.moveTo(0,-56); ctx.bezierCurveTo(6,-56,9,-51,9,-45); ctx.bezierCurveTo(9,-41,8,-39,7,-37);
    ctx.bezierCurveTo(13,-35,16,-31,16,-24); ctx.lineTo(18,6); ctx.lineTo(23,30); ctx.lineTo(9,32); ctx.lineTo(6,48); ctx.lineTo(2,48); ctx.lineTo(1,33);
    ctx.lineTo(-1,33); ctx.lineTo(-2,48); ctx.lineTo(-6,48); ctx.lineTo(-9,32); ctx.lineTo(-23,30); ctx.lineTo(-18,6); ctx.lineTo(-16,-24);
    ctx.bezierCurveTo(-16,-31,-13,-35,-7,-37); ctx.bezierCurveTo(-8,-39,-9,-41,-9,-45); ctx.bezierCurveTo(-9,-51,-6,-56,0,-56);
    ctx.fill(); ctx.restore();
  }
  function scene(t,dt){
    const m=fx.mode, c=col();
    // ground tone
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#050a1c"); bg.addColorStop(.55,"#03050d"); bg.addColorStop(1,"#020308"); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    if(m==="storm"||m==="burst"){
      clouds.forEach(cl=>{ cl.x+=cl.vx*dt; if(cl.x<-.4) cl.x=1.4; if(cl.x>1.4) cl.x=-.4;
        const cc=cl.v?[139,92,255]:c; glowCircle(cl.x*W,cl.y*H,cl.r*Math.max(W,H),`rgba(${cc[0]},${cc[1]},${cc[2]},${.12+flash*.25})`); });
    }
    if(m==="storm"||m==="calm"){ glowCircle(W*.78,H*.1,Math.max(W,H)*.7,`rgba(${c[0]},${c[1]},${c[2]},${m==="storm"?.22:.12})`); glowCircle(W*.05,H*.95,W*.9,"rgba(90,50,200,.08)"); }
    if(m==="moon"){
      stars.forEach(s=>{ s.a+=dt*.002; ctx.fillStyle=`rgba(200,220,255,${.3+.3*Math.sin(s.a)})`; ctx.fillRect(s.x*W,s.y*H,s.r,s.r); });
      const mx=W*.14,my=H*.11,mr=Math.min(W,H)*.085;
      glowCircle(mx,my,mr*4,"rgba(120,160,255,.22)");
      const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr); mg.addColorStop(0,"#f2f6ff"); mg.addColorStop(.7,"#b9c9ee"); mg.addColorStop(1,"#7f93c4");
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
      ctx.fillStyle="rgba(90,110,160,.25)"; [[.3,.2,.18],[-.35,.1,.12],[.05,-.4,.1],[-.1,.45,.08]].forEach(k=>{ ctx.beginPath(); ctx.arc(mx+k[0]*mr,my+k[1]*mr,k[2]*mr,0,7); ctx.fill(); });
      const base=H*.98; ctx.fillStyle="#040713";
      ruins.forEach(r=>{ ctx.beginPath(); if(r.arch){ ctx.moveTo(r.x,base); ctx.lineTo(r.x,base-r.h); ctx.arc(r.x+r.w/2,base-r.h,r.w/2,Math.PI,0); ctx.lineTo(r.x+r.w,base); } else { ctx.moveTo(r.x,base); ctx.lineTo(r.x,base-r.h); ctx.lineTo(r.x+r.w*.5,base-r.h-(r.broken?-8:6)); ctx.lineTo(r.x+r.w,base-r.h+(r.broken?10:0)); ctx.lineTo(r.x+r.w,base); } ctx.closePath(); ctx.fill(); });
      const fog=ctx.createLinearGradient(0,H*.7,0,H); fog.addColorStop(0,"rgba(60,90,170,0)"); fog.addColorStop(1,"rgba(60,90,170,.25)"); ctx.fillStyle=fog; ctx.fillRect(0,H*.7,W,H*.3);
    }
    if(m==="gate"){
      const gw=Math.min(W*.4,200), gh=gw*1.75, gx=W/2, gy=H*.42;
      glowCircle(gx,gy-gh*.1,gh*1.3,`rgba(${c[0]},${c[1]},${c[2]},.28)`);
      // rays
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<14;i++){ const a=-Math.PI/2+(i-6.5)*.16+Math.sin(t*.0004+i)*.03; ctx.fillStyle=`rgba(${c[0]},${c[1]+40},255,${.035+.02*Math.sin(t*.001+i)})`; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+Math.cos(a-.05)*H,gy+Math.sin(a-.05)*H); ctx.lineTo(gx+Math.cos(a+.05)*H,gy+Math.sin(a+.05)*H); ctx.fill(); }
      ctx.restore();
      // gate body
      const path=()=>{ ctx.beginPath(); ctx.moveTo(gx-gw/2,gy+gh/2); ctx.lineTo(gx-gw/2,gy-gh/2+gw/2); ctx.arc(gx,gy-gh/2+gw/2,gw/2,Math.PI,0); ctx.lineTo(gx+gw/2,gy+gh/2); ctx.closePath(); };
      const ig=ctx.createLinearGradient(0,gy-gh/2,0,gy+gh/2); ig.addColorStop(0,"#dff0ff"); ig.addColorStop(.35,"#7fb2ff"); ig.addColorStop(1,"#1a3fb8");
      ctx.save(); path(); ctx.fillStyle=ig; ctx.shadowColor="#5d8dff"; ctx.shadowBlur=60; ctx.fill(); ctx.clip();
      ctx.globalCompositeOperation="lighter";
      for(let i=0;i<9;i++){ ctx.strokeStyle=`rgba(255,255,255,${.12+.08*Math.sin(t*.002+i)})`; ctx.lineWidth=1.5; ctx.beginPath(); for(let y=gy-gh/2;y<gy+gh/2;y+=6){ const x=gx+Math.sin(y*.03+t*.0015+i*.7)*gw*.38*Math.sin(i+1); y===gy-gh/2?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke(); }
      ctx.restore();
      ctx.save(); path(); ctx.strokeStyle="rgba(200,225,255,.9)"; ctx.lineWidth=3; ctx.shadowColor="#8fc1ff"; ctx.shadowBlur=20; ctx.stroke(); ctx.restore();
      // floor reflection
      const fl=ctx.createRadialGradient(gx,gy+gh/2,0,gx,gy+gh/2,gw*1.6); fl.addColorStop(0,"rgba(140,190,255,.5)"); fl.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=fl; ctx.save(); ctx.translate(gx,gy+gh/2); ctx.scale(1,.18); ctx.beginPath(); ctx.arc(0,0,gw*1.6,0,7); ctx.fill(); ctx.restore();
      figure(gx,gy+gh/2-48*Math.min(1.3,gw/150),Math.min(1.3,gw/150));
    }
    if(m==="vortex"){
      const cx=W/2, cy=Math.min(H*.3,250);
      glowCircle(cx,cy,Math.max(W,H)*.6,`rgba(${c[0]},${c[1]},${c[2]},.2)`);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<16;i++){ const r=110+i*14, a0=t*.00025*(i%2?1:-1)*(1+i*.08)+i; ctx.strokeStyle=`rgba(${c[0]+40},${c[1]+40},255,${.28-i*.014})`; ctx.lineWidth=i<3?2:1; ctx.shadowColor=`rgb(${c[0]},${c[1]},${c[2]})`; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(cx,cy,r,a0,a0+1.1+Math.sin(i)*.6); ctx.stroke(); }
      ctx.restore();
    }
    if(m==="burst"){
      const cx=W/2, cy=H*.42; burstT+=dt;
      glowCircle(cx,cy,Math.max(W,H)*.7,`rgba(${c[0]},${c[1]},${c[2]},.35)`);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<28;i++){ const a=i/28*6.283+t*.00015; ctx.fillStyle=`rgba(140,190,255,${.05+.04*Math.sin(t*.003+i*1.7)})`; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a-.03)*H,cy+Math.sin(a-.03)*H); ctx.lineTo(cx+Math.cos(a+.03)*H,cy+Math.sin(a+.03)*H); ctx.fill(); }
      ctx.restore();
      if(!reduce&&Math.random()<.02*dt/16) rings.push({r:20,life:1});
    }
    // shockwave rings
    for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.r+=dt*.35; r.life-=dt/1400; if(r.life<=0){rings.splice(i,1);continue;} ctx.strokeStyle=`rgba(160,200,255,${r.life*.6})`; ctx.lineWidth=2; ctx.shadowColor="#3d7bff"; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(W/2,H*.42,r.r,0,7); ctx.stroke(); ctx.shadowBlur=0; }
    // lightning
    if(!reduce){
      const chance=m==="burst"?.06:m==="storm"?.014:m==="calm"?.0015:0;
      if(Math.random()<chance*dt/16){
        if(m==="burst"){ const a=Math.random()*6.28; bolts.push(bolt(W/2,H*.42,a,Math.max(W,H)*.45,1.6,0)); }
        else { const x=W*(m==="storm"?.45+Math.random()*.55:Math.random()); bolts.push(bolt(x,-10,Math.PI/2+(Math.random()-.5)*.4,H*(.35+Math.random()*.3),1.4+Math.random(),0)); }
        flash=Math.min(1,flash+(m==="calm"?.3:.8));
      }
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; b.life-=dt/380; if(b.life<=0){bolts.splice(i,1);continue;} drawBolt(b,Math.max(0,b.life)); }
      ctx.restore(); ctx.shadowBlur=0;
    }
    if(flash>0){ ctx.fillStyle=`rgba(${c[0]},${c[1]+30},255,${flash*.08})`; ctx.fillRect(0,0,W,H); flash=Math.max(0,flash-dt/300); }
    // particles
    const intense=m==="burst"?1.6:m==="calm"?.55:1;
    P.forEach(p=>{
      if(m==="vortex"&&!reduce){ p.ang+=dt*.0003*(1.2-p.rad); const cx=W/2, cy=Math.min(H*.3,250); const R=p.rad*Math.max(W,H)*.8; const x=cx+Math.cos(p.ang)*R, y=cy+Math.sin(p.ang)*R*.9; ctx.fillStyle=`rgba(150,195,255,${.35+.3*Math.sin(p.a+=dt*.002)})`; ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fill(); return; }
      if(!reduce){ p.y-=p.v*dt*(m==="burst"?3:1); p.a+=dt*.002; } if(p.y<-.02){p.y=1.02;p.x=Math.random();}
      const al=(.22+.35*Math.sin(p.a))*Math.min(1,intense);
      ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,7); ctx.fillStyle=`rgba(150,195,255,${Math.max(0,al)})`; ctx.fill();
    });
    // vignette
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.55)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }
  function draw(t){
    let dt=t-last; last=t; if(dt>60) dt=60;
    if(fx.mode!==prevMode){ prevMode=fx.mode; bolts.length=0; if(fx.mode==="burst"){ rings.push({r:30,life:1},{r:5,life:1}); flash=1; } }
    scene(t,dt);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

boot();
})();
