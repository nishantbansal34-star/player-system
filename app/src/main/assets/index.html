/* Layout: phone-first single column; ambient lightning canvas behind glass cards; bottom nav; overlays for level-up, loot, menu. Single dark look by choice (the System is always night). */
:root{
  --bg:#03050d;
  --card:rgba(12,20,46,.66);
  --card-2:rgba(18,30,66,.55);
  --line:rgba(88,132,255,.26);
  --line-2:rgba(120,165,255,.5);
  --glow:#3d7bff;
  --glow-2:#7fb2ff;
  --ink:#e8efff;
  --dim:#8a97bb;
  --faint:#4d5a80;
  --violet:#9a66ff;
  --gold:#f5bb4c;
  --red:#ff4f66;
  --green:#3ddc97;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--glow-2);outline-offset:2px;border-radius:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 16px calc(92px + env(safe-area-inset-bottom,0px));min-height:100%}
.ico{width:22px;height:22px;flex:none;display:block}

/* top bar */
.sysbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px;gap:12px}
.wordmark{font-family:var(--f-display);font-weight:600;letter-spacing:.34em;font-size:20px;color:#d7e4ff;text-shadow:0 0 14px rgba(80,140,255,.75),0 0 2px rgba(180,210,255,.8)}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#bcd1ff}
.iconbtn:active{background:rgba(61,123,255,.14)}
.badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.back{display:flex;align-items:center;gap:4px;color:var(--dim);font-family:var(--f-ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.screen-title{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.18em;text-align:center;margin:14px 0 4px;text-transform:uppercase;text-wrap:balance;text-shadow:0 0 16px rgba(80,140,255,.45)}
.screen-sub{text-align:center;color:var(--dim);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}

/* surfaces */
.card{position:relative;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:inset 0 1px 0 rgba(160,190,255,.06),0 0 22px rgba(40,90,255,.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card.hot{border-color:var(--line-2);box-shadow:inset 0 0 18px rgba(61,123,255,.12),0 0 24px rgba(61,123,255,.18)}
.card.red{border-color:rgba(255,79,102,.45);background:linear-gradient(180deg,rgba(70,10,24,.55),rgba(30,6,14,.7));box-shadow:0 0 24px rgba(255,79,102,.14)}
.card.violet{border-color:rgba(154,102,255,.45);background:linear-gradient(180deg,rgba(48,24,100,.5),rgba(18,10,40,.7))}
.label{font-family:var(--f-ui);font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13.5px;
  padding:12px 20px;border-radius:999px;border:1.5px solid #5d8dff;color:#fff;
  background:linear-gradient(180deg,#1d44b8,#0c1f63);box-shadow:0 0 18px rgba(61,123,255,.5),inset 0 0 14px rgba(130,175,255,.35),inset 0 1px 0 rgba(200,220,255,.4);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.38;box-shadow:none;cursor:not-allowed}
.btn.wide{width:100%}
.btn.ghost{background:rgba(61,123,255,.08);border-color:var(--line-2);box-shadow:none;color:#cfe0ff}
.btn.red{border-color:#ff6b80;background:linear-gradient(180deg,#8d1c30,#43091a);box-shadow:0 0 18px rgba(255,79,102,.4),inset 0 0 12px rgba(255,140,160,.25)}
.btn.gold{border-color:#f5c56a;background:linear-gradient(180deg,#8a5a12,#3d2605);box-shadow:0 0 18px rgba(245,187,76,.35),inset 0 0 12px rgba(255,210,130,.25)}
.btn.violet{border-color:#b08bff;background:linear-gradient(180deg,#4b2aa8,#1f0f55);box-shadow:0 0 18px rgba(154,102,255,.45),inset 0 0 12px rgba(190,160,255,.3)}
.btn.sm{padding:7px 12px;font-size:11.5px}

.bar{height:6px;border-radius:99px;background:rgba(80,120,220,.16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2c63ff,#8fc1ff);box-shadow:0 0 10px rgba(90,150,255,.9);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thick{height:9px}
.bar.red>i{background:linear-gradient(90deg,#b0142f,#ff7b8e);box-shadow:0 0 10px rgba(255,79,102,.8)}
.bar.violet>i{background:linear-gradient(90deg,#5a2fd6,#c3a4ff);box-shadow:0 0 10px rgba(154,102,255,.8)}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(61,123,255,.08);color:#cfe0ff}
.pill .ico{width:14px;height:14px}
.pill.gold{color:var(--gold);border-color:rgba(245,187,76,.4);background:rgba(245,187,76,.08)}
.pill.red{color:#ff9aaa;border-color:rgba(255,79,102,.45);background:rgba(255,79,102,.08)}
.pill.violet{color:#cdb6ff;border-color:rgba(154,102,255,.45);background:rgba(154,102,255,.1)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:rgba(5,10,26,.6)}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-family:var(--f-ui);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg button.on{color:#fff;background:linear-gradient(180deg,#1d44b8,#0f2a7a);box-shadow:0 0 12px rgba(61,123,255,.45),inset 0 0 0 1px #5d8dff}

/* home */
.home-hero{position:relative;min-height:360px;padding-top:28px;overflow:hidden}
.crystal-art{position:absolute;right:-30px;top:0;width:230px;height:360px;pointer-events:none;opacity:.95}
.greet{color:#c8d6f5;font-size:15px}
.who{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1.1;text-transform:uppercase;text-shadow:0 0 18px rgba(80,140,255,.5)}
.lvl-lbl{font-family:var(--f-ui);letter-spacing:.2em;font-size:13px;color:#a9bde6;margin-top:26px}
.lvl-big{display:flex;align-items:flex-end;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:78px;line-height:.9;color:#fff;text-shadow:0 0 22px rgba(90,150,255,.85)}
.lvl-big .ico{width:30px;height:30px;color:var(--glow-2);filter:drop-shadow(0 0 6px var(--glow));margin-bottom:8px}
.xp-row{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:13px;color:#b9c8ea;margin-top:6px}
.quote{margin:22px 0 0;max-width:230px;color:#b8c6e8;font-size:15px;font-style:italic;line-height:1.45}
.quote::before{content:"\201C";color:var(--glow-2);font-size:22px;margin-right:4px;vertical-align:-3px}
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.mini-ring{width:70px;height:70px}
.today h3{margin:0;font-family:var(--f-ui);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}

/* quests */
.quest{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px}
.qicon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(61,123,255,.28),rgba(61,123,255,.04));border:1px solid rgba(100,150,255,.2)}
.qicon .ico{width:24px;height:24px;filter:drop-shadow(0 0 5px currentColor)}
.qname{font-weight:600;font-size:15.5px}
.qdetail{font-size:12.5px;color:var(--dim)}
.qxp{font-family:var(--f-ui);font-weight:600;font-size:12.5px;color:#9cc3ff}
.qcheck{width:28px;height:28px;border-radius:50%;border:1.6px solid rgba(200,215,255,.55);display:grid;place-items:center;transition:all .2s}
.qcheck .ico{width:16px;height:16px;opacity:0}
.quest.done .qcheck{border-color:#8fc1ff;background:radial-gradient(circle,#4d8dff,#1d4fd6);box-shadow:0 0 14px rgba(90,150,255,.9)}
.quest.done .qcheck .ico{opacity:1;color:#fff}
.quest.done{border-color:var(--line-2);box-shadow:inset 0 0 22px rgba(61,123,255,.14),0 0 18px rgba(61,123,255,.14)}
.quest.done .qname{color:#cfe0ff}
.drill{grid-column:1/-1;margin:2px 0 0;padding:10px 12px;border-radius:10px;background:rgba(5,10,26,.55);border:1px dashed rgba(100,150,255,.22);font-size:13px;color:#c2cfee}
.drill ul{margin:4px 0 0;padding-left:18px}
.drill li{margin:2px 0}
.progress-line{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-ui);font-size:12.5px;letter-spacing:.06em;color:var(--dim);margin:2px 2px 0}

/* status */
.ring-wrap{position:relative;width:220px;height:220px;margin:4px auto 6px}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .l{font-family:var(--f-ui);letter-spacing:.22em;font-size:14px;color:#b5c6ea}
.ring-center .n{font-family:var(--f-ui);font-weight:700;font-size:64px;line-height:1;color:#fff;text-shadow:0 0 20px rgba(90,150,255,.9)}
.ring-center .x{font-family:var(--f-ui);font-size:12px;color:#a9b8dc;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat-tile{padding:12px 10px 10px;text-align:center}
.stat-tile .k{font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;font-size:13px;color:#b9c9ee}
.stat-tile .v{font-family:var(--f-ui);font-weight:700;font-size:26px;margin:2px 0 6px;text-shadow:0 0 12px rgba(90,150,255,.6)}
.stat-tile .plus-b{font-size:11px;color:var(--green);font-family:var(--f-ui)}
.classcard{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center}
.classrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px 0}
.classrow .ico{width:26px;height:26px;color:var(--glow-2);filter:drop-shadow(0 0 6px var(--glow))}
.classrow .t{font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.classrow .v{font-family:var(--f-ui);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase}

/* allocate */
.alloc-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid rgba(100,140,255,.1)}
.alloc-row:last-child{border-bottom:0}
.alloc-row .nm{font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;font-size:13.5px;text-transform:uppercase}
.alloc-row .cur{font-size:12px;color:var(--dim)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:rgba(5,10,26,.6)}
.stepper button{width:38px;height:36px;font-size:20px;color:#cfe0ff;display:grid;place-items:center}
.stepper button:disabled{opacity:.3}
.stepper span{width:40px;text-align:center;font-family:var(--f-ui);font-weight:600;font-size:16px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:36px}

/* achievements */
.ach{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px}
.medal{width:62px;height:62px;border-radius:12px;display:grid;place-items:center}
.medal .ico{width:34px;height:34px}
.ach .nm{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.ach .ds{font-size:12.5px;color:#c0cbe6}
.rar{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.ach.legendary{border-color:rgba(245,187,76,.55);background:linear-gradient(110deg,rgba(120,72,10,.55),rgba(40,22,4,.7) 60%,rgba(90,55,8,.5));box-shadow:0 0 22px rgba(245,187,76,.18)}
.ach.legendary .medal{color:#ffd57a;background:radial-gradient(circle,rgba(245,187,76,.35),transparent 70%)}
.ach.legendary .medal .ico{filter:drop-shadow(0 0 8px #f5bb4c)} .ach.legendary .rar{color:var(--gold)}
.ach.epic{border-color:rgba(154,102,255,.5);background:linear-gradient(110deg,rgba(60,26,120,.55),rgba(20,10,44,.7))}
.ach.epic .medal{color:#d7c4ff;background:radial-gradient(circle,rgba(154,102,255,.35),transparent 70%)}
.ach.epic .medal .ico{filter:drop-shadow(0 0 8px #9a66ff)} .ach.epic .rar{color:#c8a9ff}
.ach.rare{border-color:rgba(61,123,255,.5)}
.ach.rare .medal{color:#a9ccff;background:radial-gradient(circle,rgba(61,123,255,.35),transparent 70%)}
.ach.rare .medal .ico{filter:drop-shadow(0 0 8px #3d7bff)} .ach.rare .rar{color:#8fbaff}
.ach.mythic{border-color:rgba(255,79,102,.5);background:linear-gradient(110deg,rgba(70,10,40,.6),rgba(24,6,30,.75))}
.ach.mythic .medal{color:#ffb0c0;background:radial-gradient(circle,rgba(255,79,102,.3),transparent 70%)} .ach.mythic .rar{color:#ff9aaa}
.ach.common .medal{color:#c7d2ea;background:radial-gradient(circle,rgba(160,175,210,.25),transparent 70%)} .ach.common .rar{color:var(--dim)}
.ach.locked{filter:saturate(.25) brightness(.7)}
.ach.locked .medal .ico{filter:none}

/* inventory */
.inv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 10px;text-align:center;border-radius:12px}
.tile .art{width:100%;max-width:92px;aspect-ratio:1}
.tile .art svg{width:100%;height:100%}
.tile .nm{font-size:12.5px;line-height:1.2;font-weight:600;color:#dbe5ff}
.tile .ct{font-family:var(--f-ui);font-size:11px;color:var(--dim)}
.tile.locked{opacity:.35}
.empty{padding:22px;text-align:center;color:var(--dim)}

/* stats */
.srow{display:grid;grid-template-columns:24px 92px 1fr 44px;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid rgba(100,140,255,.08)}
.srow:last-child{border-bottom:0}
.srow .nm{font-size:13.5px}
.srow .pc{font-family:var(--f-ui);font-weight:600;text-align:right;font-size:14px}
.minibars{display:flex;align-items:flex-end;gap:2px;height:26px;min-width:0}
.minibars i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:var(--c);box-shadow:0 0 6px var(--c);opacity:.95}
.minibars i.off{background:rgba(120,140,200,.16);box-shadow:none;height:4px!important}
.xpbig{font-family:var(--f-ui);font-weight:700;font-size:34px;color:#fff;text-shadow:0 0 14px rgba(90,150,255,.7)}
.xpbig small{font-size:14px;color:#9cc3ff;margin-left:4px}
.xpbars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:10px}
.xpbars i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#8fc1ff,#1f4fd6);box-shadow:0 0 8px rgba(90,150,255,.6);min-height:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{text-align:center;padding:12px 6px}
.kpi .n{font-family:var(--f-ui);font-weight:700;font-size:24px}
.kpi .t{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* v4 visual layer */
.rbadge{display:block;overflow:visible}
.hero-badge{position:absolute;right:-6px;top:34px;width:150px;height:150px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(90,150,255,.55))}
.hero-badge.gold{filter:drop-shadow(0 0 24px rgba(245,187,76,.55))}
.orbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.orb{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.orb .ball{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(110,160,255,.55);background:radial-gradient(circle at 50% 30%,rgba(61,123,255,.3),rgba(6,12,32,.9) 70%);box-shadow:0 0 14px rgba(61,123,255,.35),inset 0 0 12px rgba(120,170,255,.2);transition:transform .15s,box-shadow .25s}
.orb .ball .ico{width:26px;height:26px;filter:drop-shadow(0 0 6px currentColor)}
.orb:active .ball{transform:scale(.93)}
.orb.done .ball{border-color:#9cc8ff;background:radial-gradient(circle at 50% 30%,#4d8dff,#12339c 75%);box-shadow:0 0 22px rgba(90,150,255,.9),inset 0 0 14px rgba(200,225,255,.5)}
.orb.done .ball .ico{color:#fff!important}
.orb .tick{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#3ddc97;display:grid;place-items:center;box-shadow:0 0 10px #3ddc97}
.orb .tick .ico{width:12px;height:12px;color:#03140c!important;filter:none}
.orb .on{font-size:12px;color:#d7e3ff;line-height:1.15;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orb .ox{font-family:var(--f-ui);font-size:11.5px;color:#8fc1ff;font-weight:600}
.quote-card{font-style:italic;color:#c3d0f0;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.quote-card .qm{font-family:var(--f-display);font-size:34px;line-height:.8;color:#6fa8ff;text-shadow:0 0 12px #3d7bff}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec-h h2{margin:0;font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;font-size:15px}
.avbtn{width:40px;height:40px;border-radius:50%;display:block}
.avbtn svg{width:40px;height:40px}
.week{width:100%;border-collapse:separate;border-spacing:0 6px}
.week th{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:600;padding:0 0 4px}
.week th.today{color:#fff;text-shadow:0 0 8px #3d7bff}
.week td{text-align:center;padding:0}
.week td.nm{text-align:left;font-size:13px;padding-right:6px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.wdot{display:inline-block;width:20px;height:20px;border-radius:50%;border:1.3px solid rgba(160,180,230,.25)}
.wdot.on{border-color:transparent;background:radial-gradient(circle,var(--c),rgba(0,0,0,0) 120%);box-shadow:0 0 10px var(--c)}
.wdot.future{border-style:dashed;opacity:.35}
.set-row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid rgba(100,140,255,.1);width:100%;text-align:left}
.set-row:last-child{border-bottom:0}
.set-row .ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(61,123,255,.08);color:#aecbff}
.set-row .sv{font-size:12px;color:var(--dim)}
.prof-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:6px}
.prof-head .av{position:relative;width:128px;height:128px;border-radius:50%;filter:drop-shadow(0 0 22px rgba(90,150,255,.6))}
.prof-head .av::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#3d7bff,#9a66ff,#8fc1ff,#3d7bff);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62px,#000 63px);mask:radial-gradient(circle,transparent 62px,#000 63px)}
@keyframes spin{to{transform:rotate(360deg)}}
.rank-row{display:flex;gap:4px;justify-content:space-between;overflow-x:auto;padding:6px 0}
.rank-row div{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-ui);font-size:10px;color:var(--dim);flex:none}
.stars{color:#ffd57a;letter-spacing:2px;font-size:12px;text-shadow:0 0 8px rgba(245,187,76,.8)}
.nav button .navic{width:44px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.nav button.on .navic{background:radial-gradient(circle,rgba(61,123,255,.45),rgba(61,123,255,.08) 70%);box-shadow:0 0 16px rgba(61,123,255,.45),inset 0 0 0 1px rgba(120,170,255,.45)}
#splash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7vh 24px calc(10vh + env(safe-area-inset-bottom,0px));transition:opacity .6s ease;pointer-events:none}
#splash.gone{opacity:0}
body.splashing .app,body.splashing .nav{opacity:0}
.app,.nav{transition:opacity .5s ease}
#splash .sw{font-family:var(--f-display);font-weight:600;letter-spacing:.34em;font-size:40px;color:#e6efff;text-shadow:0 0 24px rgba(90,150,255,.95),0 0 3px #fff;padding-left:.34em}
#splash .ss{font-family:var(--f-ui);letter-spacing:.42em;font-size:12px;color:#a9c3f0;margin-top:10px;text-align:center;padding-left:.42em}
#splash .sa{font-family:var(--f-display);letter-spacing:.6em;font-size:16px;color:#cfe0ff;text-shadow:0 0 14px #3d7bff;padding-left:.6em}
#splash .sp{width:min(220px,60vw);height:3px;border-radius:3px;background:rgba(80,120,220,.2);overflow:hidden;margin-top:14px}
#splash .sp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2c63ff,#bfe0ff);box-shadow:0 0 10px #5d8dff;animation:load 1.4s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes load{to{width:100%}}
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:space-between;padding:6vh 0 4vh}
.onb .top{text-align:center}
.onb .card{padding:22px 18px}
.shock{position:absolute;left:50%;top:40%;width:10px;height:10px;border-radius:50%;border:2px solid rgba(160,200,255,.8);transform:translate(-50%,-50%);animation:shock 1.6s ease-out infinite;pointer-events:none}
.shock.s2{animation-delay:.5s}.shock.s3{animation-delay:1s}
@keyframes shock{from{width:10px;height:10px;opacity:1}to{width:520px;height:520px;opacity:0}}
.toast{grid-template-columns:48px 1fr auto;padding:12px;border-radius:14px;background:linear-gradient(110deg,rgba(18,34,86,.97),rgba(6,12,32,.97))}
.toast .ti{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,rgba(61,123,255,.35),transparent 70%);border:1px solid rgba(120,170,255,.35)}
.toast .ti .ico{width:26px;height:26px;filter:drop-shadow(0 0 6px currentColor)}
.toast .tm{font-family:var(--f-ui);font-weight:600;font-size:15px;color:#fff;display:block;margin-top:1px}
.toast .tb{font-size:12.5px;color:#b9c8ea}
.toast.gold{background:linear-gradient(110deg,rgba(92,58,8,.97),rgba(30,18,4,.97))}
.toast.violet{background:linear-gradient(110deg,rgba(60,26,130,.97),rgba(18,8,44,.97))}
.toast.red{background:linear-gradient(110deg,rgba(100,14,34,.97),rgba(30,6,14,.97))}
.toast.streak{border-color:rgba(255,140,60,.7);box-shadow:0 0 24px rgba(255,120,40,.35);background:linear-gradient(110deg,rgba(110,40,6,.97),rgba(34,12,4,.97))}
.toast.streak .ti{color:#ffae57;border-color:rgba(255,160,80,.5);background:radial-gradient(circle,rgba(255,120,40,.45),transparent 70%)} .toast.streak b{color:#ffc27a}
.stat-tile .k{font-size:10.5px;letter-spacing:.12em}
/* heatmap + charts */
.heat{display:flex;gap:3px;width:max-content}
.heat span{display:flex;flex-direction:column;gap:3px}
.heat i{width:9px;height:9px;border-radius:2px;display:block}
.chart svg{width:100%;height:120px;display:block}
.qedit{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(100,140,255,.1)}
.qedit:last-child{border-bottom:0}
.toggle{width:44px;height:26px;border-radius:99px;background:rgba(120,140,200,.25);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd8ee;transition:transform .2s}

function migrate(d){

    if(!Array.isArray(m.quests)||!m.quests.length) m.quests=JSON.parse(JSON.stringify(BASE_QUESTS));
    if(!m.totalXp) m.totalXp=Object.values(m.history||{}).reduce((a,h)=>a+((h&&h.xp)||0),0);
    ["weekly","archive"].forEach(k=>{ if(!m[k]||typeof m[k]!=="object") m[k]={}; }); if(!Array.isArray(m.body)) m.body=[];
    return m; }
  ["name","startDate","lastSeen","level","xp","gold","potions","streak","bestStreak","totalDays","rewards","statPoints"].forEach(k=>{ if(d[k]!=null) s[k]=d[k]; });

function rec(k){ let h=S.history[k]; if(!h){ h=S.history[k]={q:{},xp:0}; } if(!h.q) h.q={}; return h; }

function habitDone(h,id){ if(!h) return false; return id==="daily"?!!h.cleared:!!(h.q&&h.q[id]); }
function habitStreak(id){ let k=today(), n=0; if(!habitDone(S.history[k],id)) k=addDay(k,-1); while(habitDone(S.history[k],id)){ n++; k=addDay(k,-1); } return n; }
function activeShadows(){ return S.shadows.filter(sh=>habitStreak(sh.habit)>0).length; }
function mult(){ let m=1+Math.min(.30,activeShadows()*.03); if(S.penalty) m*=.5; return m; }

// ---- quest plan ----
function splitFor(dow){ const rest=S.settings.restDay; if(dow===rest) return "Mobility"; return SPLITS[(dow-rest-1+7)%7]; }
function planFor(k){
  const dow=parseDay(k).getDay(), tier=tierOf(S.level), trial=S.jobTrial===k, dm=DIFF[S.settings.difficulty]||1, m=dm*(trial?1.5:1);
  const r=(v,step)=>Math.max(step,Math.round(v/step)*step);
  const split=splitFor(dow);
  const mins=split==="Mobility"?10:r([15,20,25,30,40,45][tier]*m,5);
  const steps=r([4000,5000,6000,7000,8000,10000][tier]*m,500);
  const pages=r([5,10,15,20,25,30][tier]*m,5);
  const deep=r([30,45,60,75,90,120][tier]*m,15);
  const water=[2,2.5,2.5,3,3,3.5][tier];
  const late=S.settings.difficulty==="hard"?"10":"11";
  const drills=(DRILLS[split]||[]).map(d=>[d[0],Array.isArray(d[1])?d[1][tier]:d[1]]);
  return Q().map(q=>{
    let detail="";
    if(q.kind!=="auto"||q.custom){ return Object.assign({},q,{detail:q.custom||"",drills:null,split}); }
    if(q.id==="train") detail=(split==="Mobility"?"Mobility & stretch":split+" day")+" · "+mins+" min";
    if(q.id==="walk") detail="Walk "+fmt(steps)+" steps";
    if(q.id==="read") detail="Read "+pages+" pages";
    if(q.id==="deep") detail=deep+" min focused work, phone away";
    if(q.id==="water") detail="Drink "+water+" L of water";
    if(q.id==="disc") detail="No social media after "+late+" PM";
    return Object.assign({},q,{detail,drills:q.id==="train"?drills:null,split});
  });
}
function widgetPlan(){ const out=[]; const base=today(); const dows={}; for(let i=0;i<7;i++){ const k=addDay(base,i); dows[parseDay(k).getDay()]=planFor(k).map(q=>({id:q.id,name:q.id==="train"&&q.name==="Physical Training"?"Training":q.name,detail:q.detail,xp:q.xp,icon:q.icon})); } for(let d=0;d<7;d++) out.push(dows[d]); return out; }

// ---- notes / log / toast ----
function note(type,title,body,kind){ S.notes.unshift({t:Date.now(),type,title,body,kind:kind||""}); if(S.notes.length>50) S.notes.length=50; }
function log(msg){ S.log.unshift({t:Date.now(),msg}); if(S.log.length>80) S.log.length=80; }
function toast(head,msg,kind,icon,undo){
  const el=document.createElement("div"); el.className="toast "+(kind||"");
  const parts=String(msg).split(" · "); const main=parts.shift(); const rest=parts.join(" · ");
  el.innerHTML=`<span class="ti">${ico(icon||"bolt")}</span><div style="min-width:0"><b>${esc(head)}</b><span class="tm">${esc(main)}</span>${rest?`<span class="tb">${esc(rest)}</span>`:""}</div>${undo?`<button class="undo" data-act="undo">Undo</button>`:"<span></span>"}`;
  const box=document.getElementById("toasts"); box.appendChild(el); while(box.children.length>2) box.firstChild.remove();
  setTimeout(()=>el.remove(),undo?5000:3200);
}

// ---- progression ----
function gain(base,k){
  const amt=Math.round(base*mult()); const from=S.level;
  S.xp+=amt; S.totalXp=(S.totalXp||0)+amt; rec(k||today()).xp+=amt;
  while(S.xp>=need(S.level)){ S.xp-=need(S.level); S.level++; S.statPoints+=5; }
  if(S.level>=100 && S.job!=="Shadow Monarch"){ S.job="Shadow Monarch"; note("level","Job changed","You have become the Shadow Monarch.","violet"); }
  if(S.level>from){ S.pendingLevelUp={from:(S.pendingLevelUp&&S.pendingLevelUp.from)||from,to:S.level}; note("level","Level up","You reached Level "+S.level+". +"+5*(S.level-from)+" stat points."); log("Reached Level "+S.level); }
  return amt;
}
function checkAch(silent){
  ACH.forEach(a=>{ if(!S.ach.includes(a.id) && a.cond(S)){ S.ach.push(a.id); if(!silent){ toast("Title unlocked",a.name,"gold","trophy"); note("title","New title unlocked",a.name,"gold"); } log("Achievement: "+a.name); }});
}
function afterQuest(h,k){
  const n=doneCount(h);
  if(n>=clearAt() && !h.cleared){
    h.cleared=true; h.loot=true; S.streak++; S.totalDays++; S.bestStreak=Math.max(S.bestStreak,S.streak); S.statPoints+=3;
    if(S.streak%7===0 && (S.freezes||0)<2){ S.freezes=(S.freezes||0)+1; note("loot","Streak shield earned","A shield will absorb one missed day. You hold "+S.freezes+".","gold"); }
    const x=gain(40,k);
    toast("Daily quest cleared","+"+x+" XP · +3 stat points · loot box ready","","trophy");
    if(S.streak>1) setTimeout(()=>toast("Streak increased",S.streak+" days · Keep going.","streak","flame"),900);
    note("quest","Daily quest cleared","+3 stat points. A loot box is waiting in Quests.");
    log("Daily quest cleared (streak "+S.streak+")");

function archiveOld(){

}
function processDays(){

      if(S.pause && d>=S.pause.since){ rec(d).paused=true; }
      else if((S.freezes||0)>0){ S.freezes--; rec(d).frozen=true; shielded++; }
      else { missed++; lastMiss=d; }
    }
    d=addDay(d,1); }
  if(S.jobTrial && S.jobTrial<t){ S.jobTrial=null; note("shadow","Trial failed","The Job Change trial expired. Try again another day.","red"); }
  S.lastSeen=t;

  if(missed>0){
    if(S.penalty){ S.penalty.forDay=lastMiss; S.penalty.multi=true; } else S.penalty={since:t,forDay:lastMiss,prevStreak:prev,multi:missed>1};

let saving=false, dirty=false, saveTimer=null;

async function boot(){

    if(!data){ try{ data=JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){} }
    if(docRef){ docRef.onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites||saving||dirty||!S) return; const d=s.data(); if(JSON.stringify(d.history)===JSON.stringify(S.history)&&d.xp===S.xp&&d.level===S.level&&d.gold===S.gold&&d.statPoints===S.statPoints) return; S=migrate(d); render(); },()=>{}); }

function heatmap(){

function lineChart(vals,color,unit){
  const pts=vals.filter(v=>v.v!=null&&v.v!==""); if(pts.length<2) return `<p class="tiny muted" style="margin:6px 0 0">${pts.length?"Latest: "+pts[0].v+unit+". Log again next week to see a trend.":"No entries yet."}</p>`;
  const ys=pts.map(p=>+p.v), lo=Math.min(...ys), hi=Math.max(...ys), rg=(hi-lo)||1, W=300, H=110, P=14;
  const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), H-P-((+p.v-lo)/rg)*(H-2*P)]);
  const d=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const first=ys[0], last=ys[ys.length-1], diff=+(last-first).toFixed(1);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${P} ${H-P}H${W-P}" stroke="rgba(120,140,200,.2)"/><path d="${d} L${xy[xy.length-1][0]} ${H-P} L${P} ${H-P}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${xy.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===xy.length-1?4:2.5}" fill="${color}"/>`).join("")}</svg></div>
    <div class="tiny muted">${pts.length} check-ins · latest <b style="color:var(--ink)">${last}${unit}</b> · ${diff>0?"+":""}${diff}${unit} since first</div>`;
}

function openLoot(bonus){
  const h=rec(today());

  else { if(!h.loot||h.lootOpened) return; h.lootOpened=true; }
  const r=bonus?Math.random()*.5:Math.random(); let res, artKey="chest";
  const missing=Object.keys(ITEMS).filter(k=>!S.items.includes(k));
  if(r<.10&&missing.length){ const k=missing[Math.floor(Math.random()*missing.length)]; S.items.push(k); artKey=k; res={t:ITEMS[k].name,d:Object.entries(ITEMS[k].bonus).map(([s,v])=>"+"+v+" "+s).join(" · ")+" permanently"}; note("loot","Rare item found",ITEMS[k].name,"gold"); }
  else if(r<.18){ S.potions++; artKey="potion"; res={t:"Status Recovery potion",d:"Cancels one penalty."}; }
  else if(r<.45){ const x=gain(30+Math.floor(Math.random()*51)); res={t:"+"+x+" bonus XP",d:"Experience added."}; }
  else { const g=50+Math.floor(Math.random()*101); S.gold+=g; artKey="chest"; res={t:"+"+g+" Gold",d:"Spend it in the Store."}; }
  log("Loot box: "+res.t);
  fx.mode="burst"; haptic(80); document.getElementById("toasts").innerHTML="";
  document.getElementById("ov").innerHTML=`<div class="overlay" data-act="ov-bg" style="background:rgba(2,4,12,.35)"><span class="shock"></span><span class="shock s2"></span><div class="lu" style="position:relative">

    case "saveq": { const q=qById(id); if(!q) break; const nm=document.getElementById("qName").value.trim(); const dt=document.getElementById("qDetail").value.trim(); if(nm) q.name=nm; q.custom=dt; const sel=document.getElementById("qStat"); if(sel) q.stat=sel.value; ui.editQ=null; toast("Quests","Saved.","","check"); commit(); break; }
    case "addq": { const on=S.quests.filter(x=>x.enabled!==false).length; const nc=S.quests.filter(x=>x.kind==="custom").length; if(on>=MAX_QUESTS||nc>=2) break; const sty=CUSTOM_STYLE[S.quests.length%CUSTOM_STYLE.length]; const q={id:"c"+uid(),name:"New quest",stat:"DIS",xp:20,icon:sty[0],c:sty[1],kind:"custom",enabled:true,custom:""}; S.quests.push(q); ui.editQ=q.id; commit(); break; }

    case "remind": S.settings.remindOn=!S.settings.remindOn; if(S.settings.remindOn&&hasA("requestNotifications")) Android.requestNotifications(); commit(); break;

    case "ov-bg": case "lu-close": closeOv(); render(); break;
    case "lu-alloc": closeOv(); ui.alloc=null; go("allocate"); break;
    case "al": { const k=b.dataset.k, d=Number(b.dataset.d), used=Object.values(ui.alloc).reduce((x,y)=>x+y,0); if(d>0&&used>=S.statPoints) break; ui.alloc[k]=Math.max(0,ui.alloc[k]+d); render(); break; }
    case "alloc-ok": { let used=0; STAT_KEYS.forEach(k=>{ S.stats[k]+=ui.alloc[k]; used+=ui.alloc[k]; }); S.statPoints-=used; ui.alloc=null; toast("Status","Stat points allocated.","","user"); hist.pop(); screen="status"; commit(); break; }
    case "achtab": ui.achTab=b.dataset.t; render(); break;
    case "invtab": ui.invTab=b.dataset.t; render(); break;
    case "stattab": ui.statTab=b.dataset.t; render(); break;
    case "title": { const t=ACH.find(x=>x.id===id); if(t&&S.ach.includes(id)){ S.title=t.name; toast("Title equipped",t.name,"gold","crown"); commit(); } break; }
    case "inv-item": { const it=ITEMS[id]; if(!it) break; const has=S.items.includes(id);
      ovSheet(`<div style="width:120px;margin:0 auto">${art(id)}</div><h3 class="center" style="font-family:var(--f-display);letter-spacing:.08em;margin:4px 0">${esc(it.name)}</h3><p class="center small muted" style="margin:0">${esc(it.desc)}</p><p class="center num" style="color:#8fc1ff">${Object.entries(it.bonus).map(([s,v])=>"+"+v+" "+s).join(" · ")}</p><p class="center tiny muted">${has?"Owned. The bonus is already applied.":"Not found yet. Rare drop from loot boxes."}</p><div class="center"><button class="btn sm" data-act="lu-close">Close</button></div>`); break; }
    case "inv-potion": ovSheet(`<div style="width:120px;margin:0 auto">${art("potion")}</div><h3 class="center" style="font-family:var(--f-display);letter-spacing:.08em;margin:4px 0">Status Recovery</h3><p class="center small muted">Cancels an active penalty and removes Weakened. Owned: ${S.potions}.</p><div class="center" style="display:flex;gap:8px;justify-content:center">${S.penalty&&S.potions?`<button class="btn gold sm" data-act="potion">Use now</button>`:""}<button class="btn ghost sm" data-act="lu-close">Close</button></div>`); break;
    case "plank": ui.plankEnd=Date.now()+60000; render(); break;
    case "survive": if(!S.penalty) break; S.penalty=null; ui.plankEnd=null; S.flags.penaltySurvived=true; log("Survived the Penalty Zone."); note("penalty","Penalty cleared","You survived. Weakened removed."); toast("System","You survived the Penalty Zone. Weakened removed.","","flame"); commit(); break;
    case "potion": if(!S.penalty||S.potions<1) break; S.potions--; S.penalty=null; ui.plankEnd=null; log("Used a Status Recovery potion."); toast("System","Penalty cancelled. Weakened removed.","gold","potion"); closeOv(); commit(); break;
    case "trial": if(S.level<25||S.job!=="None") break; S.jobTrial=today(); note("shadow","Job change quest","Clear every quest at 1.5× targets before the day resets.","violet"); toast("Job change quest","Clear every quest at 1.5× targets today.","violet","ghost"); commit(); go("quests"); break;
    case "arise": { if(S.job==="None"||S.shadows.some(s=>s.habit===id)) break; const name=SHADOW_NAMES[S.shadows.length]; if(!name) break; S.shadows.push({name,habit:id,since:today()}); note("shadow","Arise",name+" joined your shadow army.","violet"); fx.mode="burst"; setTimeout(setScene,1600); toast("Arise",name+" has joined your shadow army.","violet","ghost"); haptic(150); commit(); break; }
    case "buy": {
      if(id==="potion"){ if(S.gold<500) break; S.gold-=500; S.potions++; toast("Store","Status Recovery potion added.","gold","potion"); commit(); break; }
      const r=S.rewards.find(r=>r.id===id); if(!r||S.gold<r.cost) break;
      if(ui.pendingBuy!==id){ ui.pendingBuy=id; render(); break; }
      S.gold-=r.cost; ui.pendingBuy=null; log("Redeemed: "+r.name); note("loot","Reward redeemed",r.name+" (−"+r.cost+" G). Enjoy it.","gold"); toast("Store","Redeemed: "+r.name+". Enjoy it.","gold","coin"); commit(); break; }
    case "del-reward": S.rewards=S.rewards.filter(r=>r.id!==id); commit(); break;
    case "diff": S.settings.difficulty=b.dataset.t; commit(); break;
    case "export": { const code=btoa(unescape(encodeURIComponent(serial()))); const done=()=>toast("Backup","Backup code copied.","","check");
      try{ navigator.clipboard.writeText(code).then(done,()=>{ ui.importOpen=true; render(); const t=document.getElementById("importBox"); t.value=code; t.select(); toast("Backup","Select and copy the code in the box.","","check"); }); }catch(err){} break; }
    case "import-open": ui.importOpen=!ui.importOpen; render(); break;
    case "import": { try{ const d=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("importBox").value.trim())))); if(!d||!d.level) throw 0; S=migrate(d); ui.importOpen=false; processDays(); toast("Backup","Progress restored.","","check"); commit(); }catch(err){ toast("Backup","That code didn't work. Copy the whole code and try again.","red","x"); } break; }
    case "reset": if(!ui.pendingReset){ ui.pendingReset=true; render(); } else { ui.pendingReset=false; S=null; screen="home"; hist=[]; if(window.Android){ try{Android.save("null");}catch(err){} } try{localStorage.removeItem(LS_KEY);}catch(err){} if(docRef) docRef.delete().catch(()=>{}); render(); } break;
  }
});
document.addEventListener("change",e=>{
  if(!S) return;
  if(e.target.id==="setName"){ S.name=e.target.value.trim()||"Player"; commit(); }
  if(e.target.id==="setRest"){ S.settings.restDay=Number(e.target.value); commit(); }
  if(e.target.id==="setDay"){ S.settings.dayStart=Number(e.target.value); S.lastSeen=today(); commit(); }
  if(e.target.id==="remAM"&&e.target.value){ S.settings.remindAM=e.target.value; commit(); }
  if(e.target.id==="remPM"&&e.target.value){ S.settings.remindPM=e.target.value; commit(); }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button][data-act]")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("submit",e=>{ e.preventDefault();
  if(e.target.id==="bodyForm"){ const g=id=>{ const v=document.getElementById(id).value.trim(); return v===""?null:Number(v); };
    const en={d:today(),weight:g("bWeight"),waist:g("bWaist"),push:g("bPush"),pull:g("bPull")};
    if([en.weight,en.waist,en.push,en.pull].every(v=>v==null||isNaN(v))){ toast("Check-in","Fill in at least one number.","red","x"); return; }
    S.body=S.body||[]; const prevLast=S.body[S.body.length-1]; const earn=!prevLast||(parseDay(en.d)-parseDay(prevLast.d))/864e5>=6;
    if(prevLast&&prevLast.d===en.d) S.body[S.body.length-1]=Object.assign(prevLast,Object.fromEntries(Object.entries(en).filter(([k,v])=>v!=null))); else S.body.push(en);
    if(S.body.length>260) S.body.shift();
    if(earn&&!(prevLast&&prevLast.d===en.d)){ const x=gain(40); toast("Check-in logged","+"+x+" XP. See you next week.","","stats"); } else toast("Check-in","Updated.","","check");
    commit(); return; }
  if(e.target.id==="addReward"){ const n=document.getElementById("rewName").value.trim(), c=Math.max(10,Math.round(Number(document.getElementById("rewCost").value)||0)); if(!n) return; S.rewards.push({id:"r"+uid(),name:n,cost:c}); commit(); } });

// ================= ambient scenes =================
// Modes: storm (home), gate (splash/onboarding), vortex (status), moon (profile), burst (level up/loot), calm (everything else).
const fx={mode:"gate",hue:"blue"};
(function(){
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dpr=1,last=0,flash=0,burstT=0,prevMode="";
  const P=[], bolts=[], rings=[], clouds=[], ruins=[], stars=[];
  function size(){
    dpr=Math.min(1.75,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ruins.length=0; let x=-10; while(x<W+20){ const w=14+Math.random()*34, h=H*(.06+Math.random()*.2), broken=Math.random()<.5; ruins.push({x,w,h,broken,arch:Math.random()<.25}); x+=w+4+Math.random()*26; }
    stars.length=0; for(let i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.1+.2,a:Math.random()*6});
  }
  size(); addEventListener("resize",size);
  for(let i=0;i<90;i++) P.push({x:Math.random(),y:Math.random(),v:.00012+Math.random()*.00045,r:.4+Math.random()*1.7,a:Math.random()*6,ang:Math.random()*6.28,rad:.15+Math.random()*.4});
  for(let i=0;i<7;i++) clouds.push({x:Math.random(),y:Math.random()*.55,r:.25+Math.random()*.35,vx:(Math.random()-.5)*.00002,v:Math.random()<.35});
  const col=()=>fx.hue==="violet"?[154,102,255]:[70,130,255];
  function bolt(x0,y0,ang,len,w,depth){
    const pts=[[x0,y0]]; let x=x0,y=y0; const n=8+Math.floor(Math.random()*8); const branches=[];
    for(let i=0;i<n;i++){ const a=ang+(Math.random()-.5)*1.1; x+=Math.cos(a)*len/n; y+=Math.sin(a)*len/n; pts.push([x,y]);
      if(depth<2&&Math.random()<.18) branches.push(bolt(x,y,ang+(Math.random()-.5)*1.4,len*(.3+Math.random()*.3),w*.55,depth+1)); }
    return {pts,branches,life:1,w};
  }
  function drawBolt(b,alpha){
    const c=col();
    ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha*.35})`; ctx.lineWidth=b.w*5; ctx.shadowColor=`rgb(${c[0]},${c[1]},${c[2]})`; ctx.shadowBlur=24;
    ctx.beginPath(); b.pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    ctx.strokeStyle=`rgba(225,238,255,${alpha})`; ctx.lineWidth=b.w; ctx.shadowBlur=10; ctx.stroke();
    b.branches.forEach(x=>drawBolt(x,alpha*.8));
  }
  function glowCircle(x,y,r,rgba){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  function figure(x,y,s){ // generic cloaked wanderer seen from behind
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.fillStyle="#02030a"; ctx.shadowColor="rgba(140,185,255,.95)"; ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.moveTo(0,-56); ctx.bezierCurveTo(6,-56,9,-51,9,-45); ctx.bezierCurveTo(9,-41,8,-39,7,-37);
    ctx.bezierCurveTo(13,-35,16,-31,16,-24); ctx.lineTo(18,6); ctx.lineTo(23,30); ctx.lineTo(9,32); ctx.lineTo(6,48); ctx.lineTo(2,48); ctx.lineTo(1,33);
    ctx.lineTo(-1,33); ctx.lineTo(-2,48); ctx.lineTo(-6,48); ctx.lineTo(-9,32); ctx.lineTo(-23,30); ctx.lineTo(-18,6); ctx.lineTo(-16,-24);
    ctx.bezierCurveTo(-16,-31,-13,-35,-7,-37); ctx.bezierCurveTo(-8,-39,-9,-41,-9,-45); ctx.bezierCurveTo(-9,-51,-6,-56,0,-56);
    ctx.fill(); ctx.restore();
  }
  function scene(t,dt){
    const m=fx.mode, c=col();
    // ground tone
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#050a1c"); bg.addColorStop(.55,"#03050d"); bg.addColorStop(1,"#020308"); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    if(m==="storm"||m==="burst"){
      clouds.forEach(cl=>{ cl.x+=cl.vx*dt; if(cl.x<-.4) cl.x=1.4; if(cl.x>1.4) cl.x=-.4;
        const cc=cl.v?[110,70,230]:c; glowCircle(cl.x*W,cl.y*H,cl.r*Math.max(W,H),`rgba(${cc[0]},${cc[1]},${cc[2]},${.12+flash*.25})`); });
    }
    if(m==="storm"||m==="calm"){ glowCircle(W*.78,H*.1,Math.max(W,H)*.7,`rgba(${c[0]},${c[1]},${c[2]},${m==="storm"?.22:.12})`); glowCircle(W*.05,H*.95,W*.9,"rgba(90,50,200,.08)"); }
    if(m==="moon"){
      stars.forEach(s=>{ s.a+=dt*.002; ctx.fillStyle=`rgba(200,220,255,${.3+.3*Math.sin(s.a)})`; ctx.fillRect(s.x*W,s.y*H,s.r,s.r); });
      const mx=W*.14,my=H*.11,mr=Math.min(W,H)*.085;
      glowCircle(mx,my,mr*4,"rgba(120,160,255,.22)");
      const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr); mg.addColorStop(0,"#f2f6ff"); mg.addColorStop(.7,"#b9c9ee"); mg.addColorStop(1,"#7f93c4");
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
      ctx.fillStyle="rgba(90,110,160,.25)"; [[.3,.2,.18],[-.35,.1,.12],[.05,-.4,.1],[-.1,.45,.08]].forEach(k=>{ ctx.beginPath(); ctx.arc(mx+k[0]*mr,my+k[1]*mr,k[2]*mr,0,7); ctx.fill(); });
      const base=H*.98; ctx.fillStyle="#040713";
      ruins.forEach(r=>{ ctx.beginPath(); if(r.arch){ ctx.moveTo(r.x,base); ctx.lineTo(r.x,base-r.h); ctx.arc(r.x+r.w/2,base-r.h,r.w/2,Math.PI,0); ctx.lineTo(r.x+r.w,base); } else { ctx.moveTo(r.x,base); ctx.lineTo(r.x,base-r.h); ctx.lineTo(r.x+r.w*.5,base-r.h-(r.broken?-8:6)); ctx.lineTo(r.x+r.w,base-r.h+(r.broken?10:0)); ctx.lineTo(r.x+r.w,base); } ctx.closePath(); ctx.fill(); });
      const fog=ctx.createLinearGradient(0,H*.7,0,H); fog.addColorStop(0,"rgba(60,90,170,0)"); fog.addColorStop(1,"rgba(60,90,170,.25)"); ctx.fillStyle=fog; ctx.fillRect(0,H*.7,W,H*.3);
    }
    if(m==="gate"){
      const gw=Math.min(W*.4,200), gh=gw*1.75, gx=W/2, gy=H*.42;
      glowCircle(gx,gy-gh*.1,gh*1.3,`rgba(${c[0]},${c[1]},${c[2]},.28)`);
      // rays
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<14;i++){ const a=-Math.PI/2+(i-6.5)*.16+Math.sin(t*.0004+i)*.03; ctx.fillStyle=`rgba(${c[0]},${c[1]+40},255,${.035+.02*Math.sin(t*.001+i)})`; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+Math.cos(a-.05)*H,gy+Math.sin(a-.05)*H); ctx.lineTo(gx+Math.cos(a+.05)*H,gy+Math.sin(a+.05)*H); ctx.fill(); }
      ctx.restore();
      // gate body
      const path=()=>{ ctx.beginPath(); ctx.moveTo(gx-gw/2,gy+gh/2); ctx.lineTo(gx-gw/2,gy-gh/2+gw/2); ctx.arc(gx,gy-gh/2+gw/2,gw/2,Math.PI,0); ctx.lineTo(gx+gw/2,gy+gh/2); ctx.closePath(); };
      const ig=ctx.createLinearGradient(0,gy-gh/2,0,gy+gh/2); ig.addColorStop(0,"#dff0ff"); ig.addColorStop(.35,"#7fb2ff"); ig.addColorStop(1,"#1a3fb8");
      ctx.save(); path(); ctx.fillStyle=ig; ctx.shadowColor="#5d8dff"; ctx.shadowBlur=60; ctx.fill(); ctx.clip();
      ctx.globalCompositeOperation="lighter";
      for(let i=0;i<9;i++){ ctx.strokeStyle=`rgba(255,255,255,${.12+.08*Math.sin(t*.002+i)})`; ctx.lineWidth=1.5; ctx.beginPath(); for(let y=gy-gh/2;y<gy+gh/2;y+=6){ const x=gx+Math.sin(y*.03+t*.0015+i*.7)*gw*.38*Math.sin(i+1); y===gy-gh/2?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke(); }
      ctx.restore();
      ctx.save(); path(); ctx.strokeStyle="rgba(200,225,255,.9)"; ctx.lineWidth=3; ctx.shadowColor="#8fc1ff"; ctx.shadowBlur=20; ctx.stroke(); ctx.restore();
      // floor reflection
      const fl=ctx.createRadialGradient(gx,gy+gh/2,0,gx,gy+gh/2,gw*1.6); fl.addColorStop(0,"rgba(140,190,255,.5)"); fl.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=fl; ctx.save(); ctx.translate(gx,gy+gh/2); ctx.scale(1,.18); ctx.beginPath(); ctx.arc(0,0,gw*1.6,0,7); ctx.fill(); ctx.restore();
      figure(gx,gy+gh/2-48*Math.min(1.3,gw/150),Math.min(1.3,gw/150));
    }
    if(m==="vortex"){
      const cx=W/2, cy=Math.min(H*.3,250);
      glowCircle(cx,cy,Math.max(W,H)*.6,`rgba(${c[0]},${c[1]},${c[2]},.2)`);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<16;i++){ const r=110+i*14, a0=t*.00025*(i%2?1:-1)*(1+i*.08)+i; ctx.strokeStyle=`rgba(${c[0]+40},${c[1]+40},255,${.28-i*.014})`; ctx.lineWidth=i<3?2:1; ctx.shadowColor=`rgb(${c[0]},${c[1]},${c[2]})`; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(cx,cy,r,a0,a0+1.1+Math.sin(i)*.6); ctx.stroke(); }
      ctx.restore();
    }
    if(m==="burst"){
      const cx=W/2, cy=H*.42; burstT+=dt;
      glowCircle(cx,cy,Math.max(W,H)*.7,`rgba(${c[0]},${c[1]},${c[2]},.35)`);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=0;i<28;i++){ const a=i/28*6.283+t*.00015; ctx.fillStyle=`rgba(140,190,255,${.05+.04*Math.sin(t*.003+i*1.7)})`; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a-.03)*H,cy+Math.sin(a-.03)*H); ctx.lineTo(cx+Math.cos(a+.03)*H,cy+Math.sin(a+.03)*H); ctx.fill(); }
      ctx.restore();
      if(!reduce&&Math.random()<.02*dt/16) rings.push({r:20,life:1});
    }
    // shockwave rings
    for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.r+=dt*.35; r.life-=dt/1400; if(r.life<=0){rings.splice(i,1);continue;} ctx.strokeStyle=`rgba(160,200,255,${r.life*.6})`; ctx.lineWidth=2; ctx.shadowColor="#3d7bff"; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(W/2,H*.42,r.r,0,7); ctx.stroke(); ctx.shadowBlur=0; }
    // lightning
    if(!reduce){
      const chance=m==="burst"?.06:m==="storm"?.014:m==="calm"?.0015:0;
      if(Math.random()<chance*dt/16){
        if(m==="burst"){ const a=Math.random()*6.28; bolts.push(bolt(W/2,H*.42,a,Math.max(W,H)*.45,1.6,0)); }
        else { const x=W*(m==="storm"?.45+Math.random()*.55:Math.random()); bolts.push(bolt(x,-10,Math.PI/2+(Math.random()-.5)*.4,H*(.35+Math.random()*.3),1.4+Math.random(),0)); }
        flash=Math.min(1,flash+(m==="calm"?.3:.8));
      }
      ctx.save(); ctx.globalCompositeOperation="lighter";
      for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; b.life-=dt/380; if(b.life<=0){bolts.splice(i,1);continue;} drawBolt(b,Math.max(0,b.life)); }
      ctx.restore(); ctx.shadowBlur=0;
    }
    if(flash>0){ ctx.fillStyle=`rgba(${c[0]},${c[1]+30},255,${flash*.08})`; ctx.fillRect(0,0,W,H); flash=Math.max(0,flash-dt/300); }
    // particles
    const intense=m==="burst"?1.6:m==="calm"?.55:1;
    P.forEach(p=>{
      if(m==="vortex"&&!reduce){ p.ang+=dt*.0003*(1.2-p.rad); const cx=W/2, cy=Math.min(H*.3,250); const R=p.rad*Math.max(W,H)*.8; const x=cx+Math.cos(p.ang)*R, y=cy+Math.sin(p.ang)*R*.9; ctx.fillStyle=`rgba(150,195,255,${.35+.3*Math.sin(p.a+=dt*.002)})`; ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fill(); return; }
      if(!reduce){ p.y-=p.v*dt*(m==="burst"?3:1); p.a+=dt*.002; } if(p.y<-.02){p.y=1.02;p.x=Math.random();}
      const al=(.22+.35*Math.sin(p.a))*Math.min(1,intense);
      ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,7); ctx.fillStyle=`rgba(150,195,255,${Math.max(0,al)})`; ctx.fill();
    });
    // vignette
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.55)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }
  function draw(t){
    let dt=t-last; last=t; if(dt>60) dt=60;
    if(fx.mode!==prevMode){ prevMode=fx.mode; bolts.length=0; if(fx.mode==="burst"){ rings.push({r:30,life:1},{r:5,life:1}); flash=1; } }
    scene(t,dt);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

boot();
})();
